<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Lakes Gardener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lato:wght@700;900&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0070E0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js" integrity="sha256-/anWf4DM5AdPeNY3O7E26Ew0yyNbipHF5ChAaNpt3EI=" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#F7F9F4;--surface:#FFFFFF;--surface-2:#F2F5EE;--ink:#2F3330;--muted:#5C615D;--line:#DCE2D6;--moss:#0070E0;--on-moss:#FFFFFF;--fern:#5A8500;--lime:#AED921;--due:#8A6D08;--over:#B3412F;--word:#565656;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121416;--surface:#1B1F22;--surface-2:#22272B;--ink:#E7EAE8;--muted:#A2A8A4;--line:#30363A;--moss:#4DA3FF;--on-moss:#04172B;--fern:#B7E03C;--lime:#AED921;--due:#D9B64A;--over:#E68A73;--word:#D6D8D6;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121416;--surface:#1B1F22;--surface-2:#22272B;--ink:#E7EAE8;--muted:#A2A8A4;--line:#30363A;--moss:#4DA3FF;--on-moss:#04172B;--fern:#B7E03C;--lime:#AED921;--due:#D9B64A;--over:#E68A73;--word:#D6D8D6;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:92px;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
h1,h2,h3{font-family:"Lato","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:60px;height:auto;flex-shrink:0}.top h1{font-family:"Lato",system-ui,sans-serif;font-weight:700;font-size:1.2rem;letter-spacing:.08em;text-transform:uppercase;color:var(--word)}
#note:empty,#timerSlot:empty{display:none}
#note{font-size:.88rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
main{max-width:720px;margin:0 auto;padding:0 16px 24px}
.page-title{font-size:1.5rem}
.round-head h2{font-size:1.6rem;letter-spacing:-.015em}
.round-head p{margin-top:4px}
.group>h2{font-size:.98rem;margin:24px 0 2px;color:var(--muted);font-weight:600}
.group.over>h2{color:var(--over)}
.stop{display:grid;grid-template-columns:40px 1fr;column-gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.lawn{width:40px;height:46px;fill:var(--fern);grid-row:span 2}
.lawn line{stroke:var(--line);stroke-width:2}
.stop-main{cursor:pointer;min-width:0}
.stop h3{font-size:1.12rem;font-weight:600}
.addr{margin-top:2px;color:var(--muted);font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{margin-top:4px;font-size:.92rem;display:flex;flex-wrap:wrap;gap:2px 12px}
.status{font-weight:700}
.stop.over .status{color:var(--over)}
.stop.due .status{color:var(--due)}
.stop-actions{grid-column:2;display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:999px;border:1.5px solid var(--moss);background:transparent;color:var(--moss);padding:10px 18px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--moss);color:var(--on-moss)}
.btn.small{padding:6px 14px;min-height:40px;font-size:.92rem}
.btn.warn{border-color:var(--over);color:var(--over)}
.btn.light{border-color:var(--on-moss);color:var(--on-moss)}
.btn:disabled{opacity:.4;cursor:default}
.icon{background:none;border:0;font:inherit;font-size:1.5rem;line-height:1;color:var(--muted);min-width:44px;min-height:44px;cursor:pointer;border-radius:10px}
.icon.light{color:var(--on-moss)}
:focus-visible{outline:3px solid var(--fern);outline-offset:2px}
.timer{display:flex;align-items:center;gap:10px;background:var(--moss);color:var(--on-moss);border-radius:14px;padding:10px 8px 10px 14px}
.timer>div{flex:1;min-width:0;font-size:.92rem}
.timer strong{font-size:1rem}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 10px;flex-wrap:wrap}
.seg-btns{display:flex;gap:6px;margin-bottom:6px}
.seg-btns button{font:inherit;font-size:.92rem;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.seg-btns button[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--on-moss);font-weight:700}
.month{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 2px;color:var(--muted);font-size:.95rem}
.month h3{font-size:1rem;font-weight:600;color:var(--ink)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.item-main{min-width:0}
.item-main strong{display:block}
.item-sub{display:block;color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-end{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--fern);border-color:var(--fern)}.badge.bad{color:var(--over);border-color:var(--over)}.ready{margin:10px 0 6px}.ready h3{font-size:1rem;margin-bottom:2px}.item.on strong{color:var(--moss)}.section-h{font-size:1.2rem;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}details.f summary{cursor:pointer;font-weight:700}a.btn{text-decoration:none;display:inline-flex;align-items:center}
.empty{padding:36px 0}
.empty h2{font-size:1.6rem;margin-bottom:8px}
.empty p{color:var(--muted);margin-bottom:18px;max-width:34em}
label.f,fieldset.f{display:block;margin:14px 0 0;font-weight:700;font-size:.92rem;border:0;padding:0}
fieldset.f legend{padding:0;font-weight:700}
.hint{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;font-weight:400;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;margin-top:6px;min-height:44px}
textarea{resize:vertical;max-width:100%}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{position:relative;font-weight:400}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:.92rem;cursor:pointer;background:var(--surface)}
.chip input:checked+span{background:var(--moss);border-color:var(--moss);color:var(--on-moss);font-weight:700}
.chip input:focus-visible+span{outline:3px solid var(--fern);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:.95rem}
.mat-row{display:grid;grid-template-columns:1fr 62px 86px 44px;gap:6px;align-items:end}
form[data-lt="hourly"] .only-fixed,form[data-lt="fixed"] .only-hourly,
form[data-pr="hourly"] .only-fixed,form[data-pr="fixed"] .only-hourly{display:none}
.totals{margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.totals div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.totals .grand{font-family:"Lato",system-ui,sans-serif;font-size:1.35rem;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem;cursor:pointer}
.pick input{width:22px;height:22px;accent-color:var(--moss)}
.pick-main{min-width:0}.pick-main strong{display:block}
.summary{font-size:.9rem;line-height:1.45;min-height:220px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.section{margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
.section h2{font-size:1.2rem;margin-bottom:6px}
.history{margin-top:18px}
.history h3{font-size:1rem;margin-bottom:4px}
.cal-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.cal-title{font-size:1.45rem;letter-spacing:-.015em;flex:1;min-width:9em}
.cal-sum{flex:1;font-size:.9rem;min-width:8em}
.daylink{background:none;border:0;font:inherit;color:inherit;padding:0;cursor:pointer;font-weight:600}
.week{display:flex;flex-direction:column}
.day{padding:10px 0 6px;border-bottom:1px solid var(--line)}
.day h3{font-size:1rem;margin-bottom:6px}
.day.today h3{color:var(--moss)}
.day.today h3 .daylink::after{content:" (today)";font-weight:400}
.day .none{color:var(--muted);font-size:.88rem;margin-bottom:4px}
.appt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--moss);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.appt .t{display:block;font-size:.84rem;color:var(--muted)}
.appt strong{display:block;font-size:1rem;font-weight:700}
.appt .sub{display:block;font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .flag{font-weight:700}
.appt.completed{border-left-color:var(--lime)}.appt.completed strong,.appt.completed .sub{opacity:.7}.appt.completed .flag{color:var(--fern)}
.appt.missed{border-left-color:var(--over)}.appt.missed .flag{color:var(--over)}
.appt.extra{border-left-color:var(--due)}
.appt.skipped{border-left-color:var(--line);opacity:.6}.appt.skipped strong{text-decoration:line-through}
.alert{border:1.5px solid var(--over);border-radius:14px;padding:12px 12px 6px;margin-bottom:14px}
.alert h3{font-size:1.05rem;color:var(--over)}
.alert p{margin-bottom:8px}
.detail p{margin-top:8px}
.detail a{color:var(--moss);font-weight:700}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dow{font-size:.78rem;color:var(--muted);padding:4px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mcell{min-height:62px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;background:var(--surface);font:inherit;text-align:left;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcell.out{background:transparent;color:var(--muted)}
.dnum{font-size:.84rem;font-weight:700;align-self:flex-start;padding:0 5px;border-radius:999px}
.mcell.today .dnum{background:var(--moss);color:var(--on-moss)}
.mdots{display:flex;gap:3px;flex-wrap:wrap;padding-left:3px}
.mdot{width:8px;height:8px;border-radius:50%;background:var(--moss)}
.mdot.completed{background:var(--lime)}.mdot.missed{background:var(--over)}.mdot.extra{background:var(--due)}
.mname{display:none;font-size:.74rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--moss);padding-left:4px}
.mname.completed{border-color:var(--lime);color:var(--muted)}.mname.missed{border-color:var(--over)}
@media (min-width:700px){.mname{display:block}.mdots{display:none}.mcell{min-height:92px}}
@media (min-width:980px){
  main.wide{max-width:1200px}
  main.wide .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  main.wide .day{border:1px solid var(--line);border-radius:12px;padding:8px;min-height:200px}
  main.wide .day.today{border-color:var(--lime);border-width:2px}
  main.wide .appt{padding:6px 8px}
}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto}
.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:.74rem;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;min-height:52px;cursor:pointer}
.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--moss);font-weight:700}
.sheet{position:fixed;inset:0;z-index:20}
.sheet[hidden]{display:none}
.sheet-back{position:absolute;inset:0;background:rgba(8,16,11,.5)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:0 18px calc(28px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:14px 0 6px;z-index:1}
.sheet-head h2{font-size:1.35rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.login{max-width:420px;margin:40px auto 0}.login h2{font-size:1.6rem;margin-bottom:8px}.login p{color:var(--muted);margin-bottom:10px}
body.signed-out .tabs{display:none}
@media (max-width:380px){.row3{grid-template-columns:1fr 1fr}.row3 label:last-child{grid-column:span 2}}
</style>
</head>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GBP=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});
const gbp=n=>GBP.format(Number(n)||0);
const pad=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function localDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function localTime(d){return `${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function toUTC(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);}
function fromUTC(t){const d=new Date(t);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;}
function addDays(s,n){return fromUTC(toUTC(s)+n*864e5);}
function addMonths(s,n){const [y,m,d]=s.split('-').map(Number);const last=new Date(Date.UTC(y,m-1+n+1,0)).getUTCDate();return fromUTC(Date.UTC(y,m-1+n,Math.min(d,last)));}
function daysBetween(a,b){return Math.round((toUTC(b)-toUTC(a))/864e5);}

    for(const r of data)m.set(r.id,{...r.data,id:r.id});if(data.length<1000)break;from+=1000;}cache[k]=m;emit(k);}
  return{kind:'cloud',
    async watch(handlers,onErr){h=handlers;

      for(const k of Object.keys(TABLE))ch.on('postgres_changes',{event:'*',schema:'public',table:TABLE[k],filter:`owner_id=eq.${uid}`},p=>{

      ch.subscribe(st=>{if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')onErr&&onErr();});
      try{await Promise.all([...Object.keys(TABLE).map(load),
        sb.from('settings').select('data').maybeSingle().then(({data,error})=>{if(error)throw error;settings=data?data.data:null;h.settings(settings);})]);}

    },
    async put(k,id,o){const{id:_,...d}=clone(o);cache[k].set(id,{...d,id});emit(k);
      const{error}=await sb.from(TABLE[k]).upsert({owner_id:uid,id,data:d},{onConflict:'owner_id,id'});if(error)throw error;},
    async remove(k,id){cache[k].delete(id);emit(k);const{error}=await sb.from(TABLE[k]).delete().eq('id',id);if(error)throw error;},
    async putSettings(o){settings=clone(o);const{error}=await sb.from('settings').upsert({owner_id:uid,data:settings},{onConflict:'owner_id'});if(error)throw error;}};

function visitTotals(v){
  const mins=Number(v.minutes)||0;
  const labour=v.labourType==='fixed'?Number(v.fixedPrice)||0:(mins/60)*(Number(v.rate)||0);
  const materials=(v.materials||[]).reduce((s,m)=>s+(Number(m.qty)||0)*(Number(m.price)||0),0);
  return{mins,labour:r2(labour),materials:r2(materials),total:r2(r2(labour)+r2(materials))};
}
function lastVisitDate(cid){let d=null;for(const v of S.visits)if(v.customerId===cid&&(!d||v.date>d))d=v.date;return d;}
function schedule(c){
  const f=FREQ[c.frequency]||FREQ.fortnightly,last=lastVisitDate(c.id),today=todayStr();
  let due;
  if(c.nextDue&&(!last||c.nextDue>last))due=c.nextDue;
  else if(!last)due=today;
  else if(!f.d)return{last,due:null,freq:0};
  else due=c.frequency==='monthly'?addMonths(last,1):addDays(last,f.d);
  return{last,due,inDays:daysBetween(today,due),since:last?daysBetween(last,today):null,freq:f.d};
}

const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

function addMins(t,m){const[h,mm]=t.split(':').map(Number);const x=(((h*60+mm+(Number(m)||0))%1440)+1440)%1440;return `${pad(Math.floor(x/60))}:${pad(x%60)}`;}

function visitIndex(){const keys=new Map(),byDay=new Map();for(const v of S.visits){if(v.scheduledKey)keys.set(v.scheduledKey,v);byDay.set(v.customerId+'|'+v.date,v);}return{keys,byDay};}
function occurrencesInRange(a,b){
  const today=todayStr(),idx=visitIndex(),out=[],exMap=new Map();
  for(const e of S.schedule)if(e.kind!=='extra')exMap.set(`${e.customerId}_${e.originalDate}`,e);
  const push=o=>{const c=S.customers[o.customerId];o.start=o.start||'';o.duration=Number(o.duration)||Number(c&&c.duration)||60;
    const v=idx.keys.get(o.key)||idx.byDay.get(o.customerId+'|'+o.date);o.visitId=v?v.id:null;
    if(!o.status)o.status=v?'completed':o.date<today?'missed':'scheduled';out.push(o);};
  for(const c of Object.values(S.customers)){
    if(c.status==='paused')continue;
    const step=freqStep(c),anchor=anchorFor(c);
    const mk=orig=>{if(orig<a||orig>b)return;const ex=exMap.get(`${c.id}_${orig}`);if(ex&&ex.kind==='moved')return;
      push({key:`r:${c.id}:${orig}`,kind:'regular',customerId:c.id,origDate:orig,date:orig,start:c.startTime,duration:c.duration,status:ex&&ex.kind==='skipped'?'skipped':null});};
    if(!step){if(c.nextDue||!S.visits.some(v=>v.customerId===c.id))mk(anchor);continue;}
    if(c.frequency==='monthly'){for(let k=0;k<600;k++){const d=addMonths(anchor,k);if(d>b)break;mk(d);}}
    else{let k=Math.max(0,Math.floor(daysBetween(anchor,a)/step));for(let n=0;n<400;n++,k++){const d=addDays(anchor,k*step);if(d>b)break;mk(d);}}

  for(const e of S.schedule){

    if(e.kind==='moved')push({key:`r:${e.customerId}:${e.originalDate}`,kind:'regular',moved:true,customerId:e.customerId,origDate:e.originalDate,date:e.date,start:e.start,duration:e.duration,exId:e.id,notes:e.notes});
    else if(e.kind==='extra')push({key:`x:${e.id}`,kind:'extra',customerId:e.customerId,date:e.date,start:e.start,duration:e.duration,exId:e.id,notes:e.notes});
  }
  return out.sort((x,y)=>x.date.localeCompare(y.date)||(x.start||'99').localeCompare(y.start||'99')||custName(x.customerId).localeCompare(custName(y.customerId)));
}
function findOcc(key){

  const d=e?e.date:orig;return occurrencesInRange(d,d).find(o=>o.key===key)||null;

  <div class="seg-btns"><button data-action="vfilter" data-f="all" aria-pressed="${S.visitFilter==='all'}">All</button><button data-action="vfilter" data-f="uninvoiced" aria-pressed="${S.visitFilter==='uninvoiced'}">Not invoiced</button></div>`;
  if(!list.length)return h+`<p class="muted" style="margin-top:20px">${S.visits.length?'Every visit has been invoiced.':'No visits logged yet. Log one from your round or with the button above.'}</p>`;
  const months={};for(const v of list)(months[v.date.slice(0,7)]=months[v.date.slice(0,7)]||[]).push(v);
  for(const[k,vs]of Object.entries(months)){
    const tot=vs.reduce((s,v)=>s+visitTotals(v).total,0);
    h+=`<div class="month"><h3>${niceDate(k+'-01',{month:'long',year:'numeric'})}</h3><span>${gbp(tot)}</span></div>`;
    h+=vs.map(v=>{const t=visitTotals(v);return `<button class="item" data-action="edit-visit" data-id="${esc(v.id)}"><span class="item-main"><strong>${esc(custName(v.customerId))}</strong><span class="item-sub">${niceDate(v.date,{weekday:'short',day:'numeric',month:'short'})}${t.mins?`, ${fmtMins(t.mins)}`:''}${v.tasks&&v.tasks.length?`, ${esc(v.tasks.join(', '))}`:''}</span></span><span class="item-end">${gbp(t.total)}${v.invoiced?'<span class="badge ok">Invoiced</span>':''}</span></button>`;}).join('');
  }
  return h;
}

function viewCustomers(){
  if(!S.ready)return `<p class="muted">Loading…</p>`;
  const n=Object.keys(S.customers).length;
  return `<div class="bar"><h2 class="page-title">Customers</h2><button class="btn small primary" data-action="new-customer">Add customer</button></div>
  ${n>5?`<input id="custSearch" type="search" placeholder="Search by name or address" aria-label="Search customers">`:''}
  <div id="custList">${custListHtml('')}</div>`;
}
function custListHtml(q){
  q=q.trim().toLowerCase();
  const list=sortedCustomers().filter(c=>!q||(c.name||'').toLowerCase().includes(q)||(c.address||'').toLowerCase().includes(q));
  if(!Object.keys(S.customers).length)return `<p class="muted" style="margin-top:16px">No customers yet.</p>`;
  if(!list.length)return `<p class="muted" style="margin-top:16px">No customers match that search.</p>`;
  return list.map(c=>`<button class="item" data-action="edit-customer" data-id="${esc(c.id)}"><span class="item-main"><strong>${esc(c.name)}</strong><span class="item-sub">${patternLabel(c)}, ${pricingLabel(c)}</span></span><span class="item-end">${c.status==='paused'?'<span class="badge">Paused</span>':''}</span></button>`).join('');
}

function viewInvoice(){
  if(!S.ready)return `<p class="muted">Loading…</p>`;
  const custs=sortedCustomers();
  if(!custs.length)return `<section class="empty"><h2>Nothing to bill yet</h2><p>Add a customer and log some visits, then come back here to put an invoice together.</p><button class="btn primary" data-action="new-customer">Add a customer</button></section>`;
  const segs=`<div class="seg-btns" style="margin-bottom:12px"><button data-action="inv-tab" data-v="new" aria-pressed="${S.invView==='new'}">New invoice</button><button data-action="inv-tab" data-v="list" aria-pressed="${S.invView==='list'}">Invoices${S.invoices.length?` (${S.invoices.length})`:''}</button></div>`;
  if(S.invView==='list')return `<h2 class="page-title">Invoices</h2>`+segs+viewInvoiceList();
  const I=S.inv;
  if(!I.customerId||!S.customers[I.customerId]){
    const w=custs.find(c=>S.visits.some(v=>v.customerId===c.id&&!v.invoiced));
    I.customerId=(w||custs[0]).id;I.from=null;I.to=null;I.excluded=new Set();
  }
  const c=S.customers[I.customerId];
  const ready=custs.map(x=>{const vs=S.visits.filter(v=>v.customerId===x.id&&!v.invoiced);return{x,n:vs.length,t:vs.reduce((s,v)=>s+visitTotals(v).total,0)};}).filter(r=>r.n);
  const readyHtml=ready.length?`<div class="ready"><h3>Ready to invoice</h3>${ready.map(r=>`<button class="item${r.x.id===I.customerId?' on':''}" data-action="inv-pick" data-id="${esc(r.x.id)}"><span class="item-main"><strong>${esc(r.x.name)}</strong><span class="item-sub">${r.n} completed visit${r.n===1?'':'s'} not yet invoiced</span></span><span class="item-end">${gbp(r.t)}</span></button>`).join('')}</div>`:`<p class="muted" style="margin:8px 0">Every completed visit has been invoiced.</p>`;
  const un=S.visits.filter(v=>v.customerId===c.id&&!v.invoiced).map(v=>v.date).sort();
  if(!I.from)I.from=un[0]||todayStr().slice(0,8)+'01';
  if(!I.to)I.to=todayStr();
  const visits=S.visits.filter(v=>v.customerId===c.id&&v.date>=I.from&&v.date<=I.to&&(I.showInvoiced||!v.invoiced)).sort((a,b)=>a.date.localeCompare(b.date));
  const chosen=visits.filter(v=>!I.excluded.has(v.id));
  let h=`<h2 class="page-title">Invoices</h2>${segs}<p class="muted">Completed visits that haven’t been invoiced are gathered here for each customer.</p>${readyHtml}
  <label class="f">Customer<select data-change="inv-customer">${custs.map(x=>`<option value="${esc(x.id)}"${x.id===c.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
  <div class="row2"><label class="f">From<input type="date" data-change="inv-from" value="${I.from}"></label><label class="f">To<input type="date" data-change="inv-to" value="${I.to}"></label></div>
  <label class="check"><input type="checkbox" data-change="inv-show"${I.showInvoiced?' checked':''}> Include visits already invoiced</label>`;
  if(!visits.length){I.text='';return h+`<p class="muted" style="margin-top:18px">No visits to bill between these dates.</p>`;}
  h+=`<div style="margin-top:12px">${visits.map(v=>`<label class="pick"><input type="checkbox" data-change="inv-toggle" data-id="${esc(v.id)}"${I.excluded.has(v.id)?'':' checked'}><span class="pick-main"><strong>${niceDate(v.date,{weekday:'short',day:'numeric',month:'short'})}</strong><span class="item-sub">${esc((v.tasks||[]).join(', ')||'Garden maintenance')}</span></span><span class="item-end">${gbp(visitTotals(v).total)}${v.invoiced?'<span class="badge ok">Invoiced</span>':''}</span></label>`).join('')}</div>`;
  if(!chosen.length){I.text='';return h+`<p class="muted" style="margin-top:18px">Tick at least one visit to build the summary.</p>`;}
  let lab=0,mat=0,mins=0;for(const v of chosen){const t=visitTotals(v);lab+=t.labour;mat+=t.materials;mins+=t.mins;}
  I.text=invoiceText(c,chosen,I.from,I.to);
  const toMark=chosen.filter(v=>!v.invoiced).length;
  h+=`<div class="totals"><div><span>${chosen.length} visit${chosen.length===1?'':'s'}${mins?`, ${fmtMins(mins)}`:''}</span><span></span></div><div><span>Labour</span><span>${gbp(lab)}</span></div><div><span>Materials and goods</span><span>${gbp(mat)}</span></div><div class="grand"><span>Total</span><span>${gbp(lab+mat)}</span></div></div>
  <details class="f" style="margin-top:14px"><summary>Text summary (for Tide or email)</summary><textarea class="summary" readonly rows="12">${esc(I.text)}</textarea></details>
  <div class="actions"><button class="btn primary" data-action="create-invoice">Create invoice</button><button class="btn" data-action="copy-summary">Copy summary</button>${toMark?`<button class="btn" data-action="mark-invoiced">Mark ${toMark} as invoiced</button>`:''}</div>`;
  return h;
}
function invoiceText(c,visits,from,to){
  const L=[c.name];if(c.address)L.push(c.address.replace(/\s*\n\s*/g,', '));
  const long={day:'numeric',month:'long',year:'numeric'};
  L.push(`Garden maintenance, ${niceDate(from,long)} to ${niceDate(to,long)}`,'','Work carried out');
  let lab=0;const agg={};
  for(const v of visits){const t=visitTotals(v);lab+=t.labour;
    const extra=v.labourType==='fixed'?'':t.mins?` (${fmtMins(t.mins)})`:'';
    L.push(`${niceDate(v.date,{weekday:'short',day:'numeric',month:'short'})}: ${(v.tasks||[]).join(', ')||'Garden maintenance'}${extra} – ${gbp(t.labour)}`);
    for(const m of v.materials||[]){const k=m.name+'|'+(Number(m.price)||0);agg[k]=agg[k]||{name:m.name,price:Number(m.price)||0,qty:0};agg[k].qty+=Number(m.qty)||0;}}
  const mats=Object.values(agg);let mat=0;
  if(mats.length){L.push('','Materials and goods');for(const m of mats){const a=r2(m.qty*m.price);mat+=a;L.push(`${m.qty} x ${m.name} at ${gbp(m.price)} – ${gbp(a)}`);}}
  L.push('',`Labour: ${gbp(lab)}`);if(mats.length)L.push(`Materials: ${gbp(mat)}`);L.push(`Total: ${gbp(lab+mat)}`);
  return L.join('\n');
}

}

  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]=`<< /Type /Pages /Kids [${pages.map((_,i)=>`${6+i*2} 0 R`).join(' ')}] /Count ${n} >>`;
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  objs[5]={d:`<< /Type /XObject /Subtype /Image /Width ${img.w} /Height ${img.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.bytes.length} >>`,b:img.bytes};
  pages.forEach((c,i)=>{const id=6+i*2;
    objs[id]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << /Im1 5 0 R >> >> /Contents ${id+1} 0 R >>`;
    objs[id+1]={d:`<< /Length ${c.length} >>`,b:latin1(c)};});
  const chunks=[];let len=0;const push=u=>{chunks.push(u);len+=u.length;},offs=[];
  push(latin1('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
  for(let i=1;i<objs.length;i++){offs[i]=len;const o=objs[i];
    if(typeof o==='string')push(latin1(`${i} 0 obj\n${o}\nendobj\n`));
    else{push(latin1(`${i} 0 obj\n${o.d}\nstream\n`));push(o.b);push(latin1('\nendstream\nendobj\n'));}}
  const xref=len;let x=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for(let i=1;i<objs.length;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  x+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;push(latin1(x));
  const out=new Uint8Array(len);let p=0;for(const c of chunks){out.set(c,p);p+=c.length;}return out;
}
let logoBytes=null;
function logoImg(){if(!logoBytes){const bin=atob(LOGO_JPG.b64);logoBytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)logoBytes[i]=bin.charCodeAt(i);}return{w:LOGO_JPG.w,h:LOGO_JPG.h,bytes:logoBytes};}
const fmtNum=n=>{const r=Math.round(n*100)/100;return Number.isInteger(r)?String(r):r.toFixed(2).replace(/0$/,'');};
const longDate=d=>d?niceDate(d,{day:'numeric',month:'long',year:'numeric'}):'';

function invoicePdf(inv,receipt){
  const st=S.settings,H=841.89,L=48,R=547,pages=[];let c='';
  const INK='0.18 0.2 0.19',GREY='0.34 0.34 0.34',MUTED='0.46 0.48 0.47',LIME='0.68 0.85 0.13',BLUE='0 0.5 1',TINT='0.955 0.97 0.93';
  const T=(x,y,s,size,bold,col,align)=>{s=String(s);if(align==='right')x-=tw(s,size,bold);c+=`BT ${col||INK} rg /${bold?'F2':'F1'} ${size} Tf ${x.toFixed(2)} ${(H-y).toFixed(2)} Td ${pdfStr(s)} Tj ET\n`;};
  const ln=(x1,y1,x2,y2,col,w)=>{c+=`${col} RG ${w||0.8} w ${x1.toFixed(2)} ${(H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(H-y2).toFixed(2)} l S\n`;};
  const box=(x,y,w,h,col)=>{c+=`${col} rg ${x.toFixed(2)} ${(H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f\n`;};
  const wrap=(s,size,maxW,bold)=>{const out=[];for(const para of String(s).split('\n')){let cur='';for(const w of para.split(/\s+/)){const t=cur?cur+' '+w:w;if(tw(t,size,bold)>maxW&&cur){out.push(cur);cur=w;}else cur=t;}out.push(cur);}return out;};
  const footer=()=>{ln(L,H-58,R,H-58,BLUE,1.2);ln(L+60,H-52,R-60,H-52,BLUE,1.2);
    if(st.invoiceFooter)T(L,H-34,st.invoiceFooter,9,false,MUTED);T(R,H-34,`${inv.number}  page ${pages.length+1}`,9,false,MUTED,'right');};
  const cols={qty:382,unit:462,amt:R-6};
  const tableHead=y=>{box(L,y,R-L,22,TINT);ln(L,y+22,R,y+22,LIME,1.6);
    T(L+6,y+15,'Description',9.5,true,GREY);T(cols.qty,y+15,'Qty',9.5,true,GREY,'right');T(cols.unit,y+15,'Unit price',9.5,true,GREY,'right');T(cols.amt,y+15,'Amount',9.5,true,GREY,'right');return y+30;};
  // header
  const img=logoImg(),LW=168,LH=LW*img.h/img.w;
  c+=`q ${LW} 0 0 ${LH.toFixed(2)} ${L} ${(H-40-LH).toFixed(2)} cm /Im1 Do Q\n`;
  T(R,62,receipt?'RECEIPT':'INVOICE',24,true,GREY,'right');
  const meta=[['Invoice number',inv.number],['Date issued',longDate(inv.issueDate)],receipt?['Receipt date',longDate(lastPayDate(inv))]:['Payment due',longDate(inv.dueDate)]];
  let my=86;for(const[k,v]of meta){T(R-120,my,k,9,false,MUTED,'right');T(R,my,v,9.5,true,INK,'right');my+=15;}
  let y=40+LH+26;
  const from=[st.businessName||'The Lakes Gardener',...String(st.address||'').split('\n').map(s=>s.trim()).filter(Boolean),st.phone,st.email].filter(Boolean);
  const to=[inv.customerName,...String(inv.customerAddress||'').split('\n').map(s=>s.trim()).filter(Boolean),inv.customerEmail].filter(Boolean);
  T(L,y,'From',9,true,MUTED);T(312,y,receipt?'Received from':'Bill to',9,true,MUTED);
  let fy=y+15,ty=y+15;from.forEach((s,i)=>{T(L,fy,s,10,i===0,INK);fy+=13.5;});to.forEach((s,i)=>{T(312,ty,s,10,i===0,INK);ty+=13.5;});
  y=Math.max(fy,ty)+22;
  y=tableHead(y);
  for(const l of inv.lines){
    const dl=wrap(l.desc,9.5,300,false),rh=dl.length*12.5+8;
    if(y+rh>H-190){footer();pages.push(c);c='';T(L,60,`${receipt?'Receipt':'Invoice'} ${inv.number} continued`,11,true,GREY);y=tableHead(80);}
    dl.forEach((s,i)=>T(L+6,y+4+i*12.5,s,9.5,false,INK));
    T(cols.qty,y+4,l.hours?`${fmtNum(l.qty)} hrs`:fmtNum(l.qty),9.5,false,INK,'right');
    T(cols.unit,y+4,gbp(l.unit)+(l.hours?'/hr':''),9.5,false,INK,'right');
    T(cols.amt,y+4,gbp(l.amount),9.5,false,INK,'right');
    y+=rh;ln(L,y-4,R,y-4,'0.88 0.9 0.86',0.6);
  }
  y+=10;
  T(cols.unit,y+4,'Total',11,true,INK,'right');T(cols.amt,y+4,gbp(inv.total),12,true,INK,'right');
  if(receipt){y+=20;T(cols.unit,y+4,'Amount paid',10,false,INK,'right');T(cols.amt,y+4,gbp(paidAmount(inv)),10,false,INK,'right');
    y+=16;T(cols.unit,y+4,'Balance due',10,true,INK,'right');T(cols.amt,y+4,gbp(balanceDue(inv)),10,true,INK,'right');}
  y+=34;
  if(y>H-190){footer();pages.push(c);c='';y=70;}
  if(receipt){const pays=paymentsOf(inv),full=balanceDue(inv)<=0,bh=46+pays.length*14;box(L,y,R-L,bh,TINT);
    T(L+14,y+18,full?'Paid in full, thank you':'Part payment received, thank you',11,true,INK);
    T(L+14,y+33,'Payments received',9,true,MUTED);
    pays.forEach((pm,i)=>{const yy=y+48+i*14;T(L+14,yy,longDate(pm.date),10,false,INK);T(L+150,yy,[pm.method,pm.ref].filter(Boolean).join(', '),10,false,MUTED);T(R-14,yy,gbp(pm.amount),10,true,INK,'right');});}
  else{
    const bank=[['Account name',st.bankName],['Sort code',st.sortCode],['Account number',st.accountNumber],['Reference',inv.number]].filter(r=>r[1]);
    const bh=48+bank.length*14;box(L,y,R-L,bh,TINT);
    T(L+14,y+18,'How to pay',11,true,INK);
    T(L+14,y+33,`Please pay by bank transfer by ${longDate(inv.dueDate)}.`,10,false,INK);
    bank.forEach(([k,v],i)=>{T(L+14,y+50+i*14,k,10,false,MUTED);T(L+120,y+50+i*14,v,10,true,INK);});
  }
  footer();pages.push(c);
  return buildPdf(pages,logoImg());
}

function invoiceLines(visits){
  const lines=[],agg={};
  for(const v of [...visits].sort((a,b)=>a.date.localeCompare(b.date))){
    const t=visitTotals(v),what=`${niceDate(v.date,{weekday:'short',day:'numeric',month:'short'})}: ${(v.tasks||[]).join(', ')||'Garden maintenance'}`;
    if(v.labourType==='fixed')lines.push({desc:what,qty:1,unit:t.labour,amount:t.labour});
    else if(t.mins)lines.push({desc:what,qty:r2(t.mins/60),unit:Number(v.rate)||0,amount:t.labour,hours:true});
    for(const m of v.materials||[]){const k=m.name+'|'+(Number(m.price)||0);agg[k]=agg[k]||{name:m.name,price:Number(m.price)||0,qty:0};agg[k].qty+=Number(m.qty)||0;}
  }
  for(const m of Object.values(agg))lines.push({desc:m.name,qty:m.qty,unit:m.price,amount:r2(m.qty*m.price)});
  return lines;
}
function chosenVisits(){
  const I=S.inv;if(!I.customerId)return[];
  return S.visits.filter(v=>v.customerId===I.customerId&&v.date>=I.from&&v.date<=I.to&&(I.showInvoiced||!v.invoiced)&&!I.excluded.has(v.id));
}
async function createInvoice(btn){
  const c=S.customers[S.inv.customerId],chosen=chosenVisits();
  if(!c||!chosen.length)return toast('Tick at least one visit first.');
  const st=S.settings,n=Number(st.nextInvoice)||1,today=todayStr();
  const lines=invoiceLines(chosen);
  const inv={number:`${st.invoicePrefix??'TLG-'}${String(n).padStart(4,'0')}`,customerId:c.id,customerName:c.name,customerAddress:c.address||'',
    customerEmail:(c.email||'').split(',')[0].trim(),issueDate:today,dueDate:addDays(today,Number(st.paymentDays)||14),lines,
    total:r2(lines.reduce((s,l)=>s+l.amount,0)),visitIds:chosen.map(v=>v.id),status:'unpaid',paidOn:null,createdAt:new Date().toISOString()};
  const id=newId();btn.disabled=true;
  try{
    await saveSettings({...clone(S.settings),nextInvoice:n+1});
    await store.put('invoices',id,inv);
    for(const v of chosen){const{id:vid,...rest}=clone(v);await store.put('visits',vid,{...rest,invoiced:true,invoicedOn:today,invoiceId:id});}
    S.inv.excluded=new Set();openInvoiceSheet(id,inv);toast(`Invoice ${inv.number} created`);
  }catch(e){btn.disabled=false;toast('The invoice didn’t save. Check your signal and try again.');}
}
function paymentsOf(inv){if(inv.payments&&inv.payments.length)return [...inv.payments].sort((a,b)=>a.date.localeCompare(b.date));
  return inv.status==='paid'?[{amount:inv.total,date:inv.paidOn||inv.issueDate,method:'',ref:''}]:[];}
function paidAmount(inv){return r2(paymentsOf(inv).reduce((s,p)=>s+(Number(p.amount)||0),0));}
function balanceDue(inv){return Math.max(0,r2(inv.total-paidAmount(inv)));}
function lastPayDate(inv){const p=paymentsOf(inv);return p.length?p[p.length-1].date:'';}
function invStatus(inv){if(balanceDue(inv)<=0)return 'paid';if(paidAmount(inv)>0)return inv.dueDate<todayStr()?'overdue':'part';return inv.dueDate<todayStr()?'overdue':'unpaid';}
const STATUS_LABEL={paid:'Paid',overdue:'Overdue',unpaid:'Unpaid',part:'Part paid'};
const PAY_METHODS=['Bank transfer','Cash','Card','Cheque','Other'];
function receiptHref(inv){
  const st=S.settings,biz=st.businessName||'The Lakes Gardener',first=(inv.customerName||'').split(/[\s&]/)[0],bal=balanceDue(inv),last=paymentsOf(inv).slice(-1)[0];
  const body=`Hi ${first},\n\nThank you for your payment${last?` of ${gbp(last.amount)} received on ${longDate(last.date)}`:''} for invoice ${inv.number}. Your receipt is attached.\n\n${bal>0?`The remaining balance is ${gbp(bal)}.`:'This invoice is now paid in full.'}\n\nMany thanks,\n${biz}`;
  return `mailto:${encodeURIComponent(inv.customerEmail||'')}?subject=${encodeURIComponent(`Receipt for invoice ${inv.number} from ${biz}`)}&body=${encodeURIComponent(body)}`;
}
function openPaymentForm(id){
  const inv=S.invoices.find(x=>x.id===id);if(!inv)return;const bal=balanceDue(inv);
  openSheet(`<form id="payForm" data-id="${esc(id)}">${head(`Record payment`)}
  <p class="muted">Invoice ${esc(inv.number)} for ${esc(inv.customerName)}. ${gbp(bal)} still to pay.</p>
  <div class="row2"><label class="f">Amount received (£)<input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required value="${bal.toFixed(2)}"></label>
  <label class="f">Date received<input name="date" type="date" required value="${todayStr()}"></label></div>
  <label class="f">How they paid<select name="method">${PAY_METHODS.map(m=>`<option>${m}</option>`).join('')}</select></label>
  <label class="f">Reference <span class="hint">optional, e.g. the name on their bank transfer</span><input name="ref" autocomplete="off"></label>
  <div class="actions"><button class="btn primary" type="submit">Save payment</button></div></form>`);
}
async function savePayment(form){
  const id=form.dataset.id,inv=S.invoices.find(x=>x.id===id);if(!inv)return;
  const fd=new FormData(form),amount=r2(parseFloat(fd.get('amount'))),date=fd.get('date');
  if(!(amount>0)||!date)return toast('Enter the amount and date received.');
  const{id:_,...rest}=clone(inv);const payments=[...(inv.payments||[]),{amount,date,method:fd.get('method'),ref:String(fd.get('ref')||'').trim()}];
  const next={...rest,payments};const full=r2(inv.total-payments.reduce((s,p)=>s+p.amount,0))<=0;
  next.status=full?'paid':'unpaid';next.paidOn=full?date:null;
  let ok=false;
  await persist(form,async()=>{await store.put('invoices',id,next);ok=true;},full?'Payment recorded. Invoice paid in full':'Part payment recorded');
  if(ok)openInvoiceSheet(id,{...next,id});
}
function emailHref(inv){
  const st=S.settings,biz=st.businessName||'The Lakes Gardener',first=(inv.customerName||'').split(/[\s&]/)[0];
  const bank=[st.bankName&&`Account name: ${st.bankName}`,st.sortCode&&`Sort code: ${st.sortCode}`,st.accountNumber&&`Account number: ${st.accountNumber}`,`Reference: ${inv.number}`].filter(Boolean).join('\n');
  const body=`Hi ${first},\n\nPlease find attached invoice ${inv.number} for ${gbp(inv.total)}, due by ${longDate(inv.dueDate)}.\n\nYou can pay by bank transfer to:\n${bank}\n\nMany thanks,\n${biz}`;
  return `mailto:${encodeURIComponent(inv.customerEmail||'')}?subject=${encodeURIComponent(`Invoice ${inv.number} from ${biz}`)}&body=${encodeURIComponent(body)}`;
}
function openInvoiceSheet(id,fallback){
  const inv=S.invoices.find(x=>x.id===id)||fallback;if(!inv)return;
  const st=invStatus(inv),s=S.settings,missing=!s.bankName||!s.sortCode||!s.accountNumber||!s.address;
  openSheet(`${head(`Invoice ${esc(inv.number)}`)}<div class="detail">
  <p><strong>${esc(inv.customerName)}</strong> <span class="badge${st==='paid'?' ok':st==='overdue'?' bad':''}">${STATUS_LABEL[st]}</span></p>
  <p class="muted">Issued ${longDate(inv.issueDate)}. ${st==='paid'?`Paid in full ${longDate(lastPayDate(inv))}.`:`Due ${longDate(inv.dueDate)}.`}</p></div>
  <div class="totals">${inv.lines.map(l=>`<div><span>${esc(l.desc)}${l.hours?` (${fmtNum(l.qty)} hrs)`:l.qty!==1?` x ${fmtNum(l.qty)}`:''}</span><span>${gbp(l.amount)}</span></div>`).join('')}<div class="grand"><span>Total</span><span>${gbp(inv.total)}</span></div>${paymentsOf(inv).map(p=>`<div class="muted"><span>Paid ${niceDate(p.date,{day:'numeric',month:'short'})}${p.method?`, ${esc(p.method)}`:''}</span><span>−${gbp(p.amount)}</span></div>`).join('')}${paymentsOf(inv).length?`<div><strong>Balance due</strong><strong>${gbp(balanceDue(inv))}</strong></div>`:''}</div>
  ${missing?`<p class="muted" style="margin-top:12px">Your business address or bank details aren’t complete yet. Add them in Settings so they print on the invoice.</p>`:''}
  <div class="actions"><button class="btn primary" data-action="inv-pdf" data-id="${esc(id)}">Download invoice PDF</button>
  ${inv.customerEmail&&st!=='paid'?`<button class="btn" data-action="inv-send" data-id="${esc(id)}">Send invoice</button>`:''}
  ${st!=='paid'?`<button class="btn primary" data-action="inv-pay" data-id="${esc(id)}">Record payment</button>`:''}
  ${paymentsOf(inv).length?`<button class="btn${st==='paid'?' primary':''}" data-action="inv-receipt" data-id="${esc(id)}">Download receipt</button>${inv.customerEmail?`<button class="btn" data-action="rcpt-send" data-id="${esc(id)}">Send receipt</button>`:''}<button class="btn" data-action="inv-unpaid" data-id="${esc(id)}">Undo last payment</button>`:''}
  <button class="btn warn" data-action="inv-delete" data-id="${esc(id)}">Delete</button></div>
  ${inv.customerEmail?`<p class="muted" style="margin-top:10px">Send emails the PDF straight to ${esc(inv.customerEmail)}${inv.lastSent?`. Last sent ${esc(inv.lastSent)}`:''}.</p>`:`<p class="muted" style="margin-top:10px">Add an email address to this customer to send invoices from the app.</p>`}`);
}
function mailBody(href){const q=href.split('?')[1]||'';const p=new URLSearchParams(q.replace(/\+/g,'%2B'));return{subject:p.get('subject')||'',text:p.get('body')||''};}
function b64(bytes){let s='';const u=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
async function sendDoc(btn,id,receipt){
  const inv=S.invoices.find(x=>x.id===id);if(!inv)return;
  if(!armed(btn,`Tap again to email ${inv.customerEmail}`))return;
  btn.disabled=true;const old=btn.textContent;btn.textContent='Sending…';
  try{
    const m=mailBody(receipt?receiptHref(inv):emailHref(inv));
    const name=`${receipt?'Receipt':'Invoice'} ${inv.number} ${inv.customerName}.pdf`.replace(/[\/\\:*?"<>|&]+/g,' ').replace(/\s+/g,' ');
    const{data,error}=await SB.functions.invoke('send-document',{body:{invoiceId:id,kind:receipt?'receipt':'invoice',subject:m.subject,text:m.text,filename:name,pdf:b64(invoicePdf(inv,receipt)),replyTo:S.settings.email||''}});
    if(error){let msg='';try{msg=(await error.context.json()).error;}catch(e){}throw new Error(msg||error.message);}
    const when=new Date().toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    const{id:_,...rest}=clone(inv);await store.put('invoices',id,{...rest,lastSent:`${receipt?'receipt':'invoice'} on ${when}`});
    toast(`${receipt?'Receipt':'Invoice'} sent to ${inv.customerEmail}`);if(!$('#sheet').hidden)openInvoiceSheet(id);
  }catch(e){toast(`Not sent: ${e.message||'check your signal and try again'}`);if(btn.isConnected){btn.disabled=false;btn.textContent=old;}}
}
async function downloadPdf(id,receipt){
  const inv=S.invoices.find(x=>x.id===id);if(!inv)return;
  if(!S.downloads)return toast('Saving files only works when the app is opened from your Claude account.');
  const bytes=invoicePdf(inv,receipt);
  const name=`${receipt?'Receipt':'Invoice'} ${inv.number} ${inv.customerName}.pdf`.replace(/[\/\\:*?"<>|&]+/g,' ').replace(/\s+/g,' ');
  try{await S.downloads.save({filename:name,data:new Blob([bytes],{type:'application/pdf'})});}catch(e){toast('The PDF didn’t save.');}
}
function viewInvoiceList(){
  const list=[...S.invoices].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  if(!list.length)return `<p class="muted" style="margin-top:16px">No invoices yet. Create one from the New invoice tab.</p>`;
  const owed=list.reduce((s,i)=>s+balanceDue(i),0);
  return `<div class="totals"><div class="grand" style="border:0;margin:0;padding-top:0"><span>Outstanding</span><span>${gbp(owed)}</span></div></div>`+
  list.map(i=>{const st=invStatus(i);return `<button class="item" data-action="open-invoice" data-id="${esc(i.id)}"><span class="item-main"><strong>${esc(i.number)} ${esc(i.customerName)}</strong><span class="item-sub">Issued ${niceDate(i.issueDate,{day:'numeric',month:'short',year:'numeric'})}</span></span><span class="item-end">${gbp(i.total)}<span class="badge${st==='paid'?' ok':st==='overdue'?' bad':''}">${STATUS_LABEL[st]}</span></span></button>`;}).join('');
}

async function saveCustomer(form){
  const fd=new FormData(form),id=form.dataset.id||newId(),prev=S.customers[id]||{};
  const num=x=>{const n=parseFloat(x);return isNaN(n)?'':n;};
  const c={name:(fd.get('name')||'').trim(),address:(fd.get('address')||'').trim(),phone:(fd.get('phone')||'').trim(),email:(fd.get('email')||'').trim(),
    frequency:fd.get('frequency'),status:fd.get('status'),nextDue:fd.get('nextDue')||'',pricing:fd.get('pricing')||'hourly',
    rate:num(fd.get('rate')),price:num(fd.get('price')),tasks:fd.getAll('task'),notes:(fd.get('notes')||'').trim(),createdAt:prev.createdAt||new Date().toISOString(),
    day:fd.get('day')===''?'':Number(fd.get('day')),startTime:fd.get('startTime')||'',duration:parseInt(fd.get('duration'),10)||60};
  for(const k of Object.keys(prev))if(!(k in c)&&k!=='id')c[k]=prev[k];
  if(c.day!==''){let a=c.nextDue||todayStr(),n=0;while(dow(a)!==c.day&&n++<7)a=addDays(a,1);c.nextDue=a;}
  if(!c.name)return toast('Add the customer’s name first.');
  await persist(form,()=>store.put('customers',id,c),'Customer saved');
}

function matRow(m){m=m||{name:'',qty:1,price:''};
  return `<div class="mat-row"><input name="mname" list="matlist" placeholder="Item" value="${esc(m.name)}" aria-label="Item"><input name="mqty" type="number" inputmode="decimal" min="0" step="any" value="${esc(m.qty)}" aria-label="Quantity"><input name="mprice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="£" value="${esc(m.price)}" aria-label="Price each"><button type="button" class="icon" data-action="remove-mat" aria-label="Remove item">×</button></div>`;}
function readVisit(form){
  const fd=new FormData(form),tasks=fd.getAll('task'),other=(fd.get('otherTask')||'').trim();
  if(other)tasks.push(other);
  const materials=[...form.querySelectorAll('.mat-row')].map(r=>({name:r.querySelector('[name=mname]').value.trim(),qty:parseFloat(r.querySelector('[name=mqty]').value)||0,price:parseFloat(r.querySelector('[name=mprice]').value)||0})).filter(m=>m.name);
  return{customerId:fd.get('customerId'),date:fd.get('date')||'',start:fd.get('start')||'',end:fd.get('end')||'',minutes:parseInt(fd.get('minutes'),10)||0,
    tasks:uniq(tasks),materials,labourType:fd.get('labourType')==='fixed'?'fixed':'hourly',rate:parseFloat(fd.get('rate'))||0,fixedPrice:parseFloat(fd.get('fixedPrice'))||0,
    notes:(fd.get('notes')||'').trim(),invoiced:fd.get('invoiced')==='on',scheduledKey:fd.get('scheduledKey')||''};
}
function updateVisitCalc(form,target){
  const el=form.elements;
  if(target&&(target.name==='start'||target.name==='end')&&el.start.value&&el.end.value)el.minutes.value=minsBetween(el.start.value,el.end.value);
  const v=readVisit(form),t=visitTotals(v);form.dataset.lt=v.labourType;
  $('#vfTotals').innerHTML=`<div><span>Labour${v.labourType==='hourly'&&t.mins?` (${fmtMins(t.mins)} at ${gbp(v.rate)} an hour)`:''}</span><span>${gbp(t.labour)}</span></div><div><span>Materials and goods</span><span>${gbp(t.materials)}</span></div><div class="grand"><span>Total</span><span>${gbp(t.total)}</span></div>`;
}
async function saveVisit(form){
  const v=readVisit(form);
  if(!v.customerId||!v.date)return toast('Choose a customer and a date.');
  const id=form.dataset.id||newId(),prev=S.visits.find(x=>x.id===id);
  v.invoicedOn=v.invoiced?(prev&&prev.invoicedOn||todayStr()):null;
  v.createdAt=prev&&prev.createdAt||new Date().toISOString();
  const fromTimer=form.dataset.timer==='1';
  await persist(form,async()=>{await store.put('visits',id,v);if(fromTimer)await saveSettings({...clone(S.settings),timer:null});},'Visit saved');
}
async function persist(form,fn,msg){
  const btn=form.querySelector('[type=submit]');if(btn)btn.disabled=true;
  try{await fn();closeSheet();toast(msg);}
  catch(e){if(btn)btn.disabled=false;toast(e&&e.code==='quota_exceeded'?'Storage is full. Export your visits and delete old ones to make room.':'That didn’t save. Check your signal and try again.');}
}
async function saveSettings(obj){S.settings=obj;render();await store.putSettings(obj);}

function armed(btn,label){if(btn.dataset.armed)return true;const old=btn.textContent;btn.dataset.armed='1';btn.textContent=label;
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old;}},3500);return false;}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);toast('Summary copied');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'Summary copied':'Press and hold the summary to select and copy it.');
}
async function exportCsv(){
  const rows=[['Date','Customer','Address','Start','Finish','Minutes','Work done','Materials','Labour (£)','Materials (£)','Total (£)','Invoiced','Notes']];
  for(const v of [...S.visits].sort((a,b)=>a.date.localeCompare(b.date))){const t=visitTotals(v),c=S.customers[v.customerId]||{};
    rows.push([v.date,custName(v.customerId),(c.address||'').replace(/\n/g,', '),v.start,v.end,t.mins,(v.tasks||[]).join('; '),(v.materials||[]).map(m=>`${m.qty} x ${m.name} @ ${m.price}`).join('; '),t.labour.toFixed(2),t.materials.toFixed(2),t.total.toFixed(2),v.invoiced?(v.invoicedOn||'Yes'):'No',v.notes||'']);}
  const csv=rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  if(S.downloads){try{await S.downloads.save({filename:`garden-visits-${todayStr()}.csv`,data:csv});}catch(e){toast('The export didn’t complete.');}}
  else await copyText(csv);
}

document.addEventListener('click',async e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){S.tab=tab.dataset.tab;render(true);window.scrollTo(0,0);return;}
  const a=e.target.closest('[data-action]');if(!a)return;
  const id=a.dataset.id;
  switch(a.dataset.action){
    case 'close-sheet':closeSheet();break;
    case 'new-customer':openCustomerForm();break;
    case 'edit-customer':openCustomerForm(id);break;
    case 'log-visit':openVisitForm({customerId:id});break;
    case 'edit-visit':openVisitForm({id});break;
    case 'vfilter':S.visitFilter=a.dataset.f;render(true);break;
    case 'add-mat':{$('#matRows').insertAdjacentHTML('beforeend',matRow());const r=$('#matRows').lastElementChild;r.querySelector('input').focus();break;}
    case 'remove-mat':a.closest('.mat-row').remove();updateVisitCalc($('#visitForm'));break;
    case 'start-timer':
      try{await saveSettings({...clone(S.settings),timer:{customerId:id,start:new Date().toISOString(),scheduledKey:a.dataset.key||''}});closeSheet();toast('Timer started');}catch(err){toast('The timer didn’t start. Try again.');}
      break;
    case 'stop-timer':{const t=S.settings.timer;if(!t)break;const d=new Date(t.start);
      closeSheet();openVisitForm({customerId:t.customerId,date:localDate(d),start:localTime(d),end:localTime(new Date()),fromTimer:true,scheduledKey:t.scheduledKey||''});break;}
    case 'discard-timer':
      if(armed(a,'Discard?'))try{await saveSettings({...clone(S.settings),timer:null});}catch(err){toast('That didn’t save. Try again.');}
      break;
    case 'delete-visit':
      if(armed(a,'Tap again to delete')){try{await store.remove('visits',id);closeSheet();toast('Visit deleted');}catch(err){toast('That didn’t delete. Try again.');}}
      break;
    case 'delete-customer':
      if(S.visits.some(v=>v.customerId===id)){toast('This customer has visits on record. Set them to Paused instead.');break;}
      if(armed(a,'Tap again to delete')){try{await store.remove('customers',id);closeSheet();toast('Customer deleted');}catch(err){toast('That didn’t delete. Try again.');}}
      break;
    case 'reload-app':location.reload();break;
    case 'copy-summary':copyText(S.inv.text);break;
    case 'inv-tab':S.invView=a.dataset.v;render(true);break;
    case 'create-invoice':createInvoice(a);break;
    case 'inv-pick':closeSheet();S.tab='invoice';S.invView='new';Object.assign(S.inv,{customerId:id,from:null,to:null,excluded:new Set(),showInvoiced:false});render(true);
      setTimeout(()=>{const el=document.querySelector('[data-action=create-invoice]');if(el)el.scrollIntoView({block:'center'});},50);break;
    case 'open-invoice':openInvoiceSheet(id);break;
    case 'inv-pdf':downloadPdf(id,false);break;
    case 'inv-send':sendDoc(a,id,false);break;
    case 'rcpt-send':sendDoc(a,id,true);break;
    case 'sign-out':if(armed(a,'Tap again to sign out')){await SB.auth.signOut();location.reload();}break;
    case 'inv-receipt':downloadPdf(id,true);break;
    case 'inv-pay':openPaymentForm(id);break;
    case 'inv-unpaid':{const inv=S.invoices.find(x=>x.id===id);if(!inv||!armed(a,'Tap again to undo'))break;const{id:_,...rest}=clone(inv);
      const payments=paymentsOf(inv).slice(0,-1);
      try{await store.put('invoices',id,{...rest,payments,status:'unpaid',paidOn:null});toast('Last payment removed');openInvoiceSheet(id,{...rest,payments,status:'unpaid',paidOn:null,id});}catch(e){toast('That didn’t save. Try again.');}break;}
    case 'inv-delete':{const inv=S.invoices.find(x=>x.id===id);if(!inv||!armed(a,'Tap again to delete'))break;
      try{for(const v of S.visits.filter(v=>v.invoiceId===id)){const{id:vid,...rest}=clone(v);delete rest.invoiceId;await store.put('visits',vid,{...rest,invoiced:false,invoicedOn:null});}
        await store.remove('invoices',id);closeSheet();toast(`Invoice ${inv.number} deleted`);}catch(e){toast('That didn’t delete. Try again.');}break;}
    case 'cal-view':S.cal.view=a.dataset.v;render(true);break;
    case 'cal-move':S.cal.date=shiftCal(Number(a.dataset.n));render(true);break;
    case 'cal-today':S.cal.date=todayStr();render(true);break;
    case 'cal-day':S.cal.date=a.dataset.d;S.cal.view='day';render(true);window.scrollTo(0,0);break;
    case 'open-occ':openOccurrence(a.dataset.key);break;
    case 'new-appt':openApptForm({date:a.dataset.d});break;
    case 'move-occ':openApptForm({key:a.dataset.key});break;
    case 'log-occ':{const o=findOcc(a.dataset.key);if(!o)break;closeSheet();
      openVisitForm({customerId:o.customerId,date:o.date>todayStr()?todayStr():o.date,start:o.start,end:o.start?addMins(o.start,o.duration):'',scheduledKey:o.key});break;}
    case 'skip-occ':{const o=findOcc(a.dataset.key);if(!o||!armed(a,o.kind==='extra'?'Tap again to cancel':'Tap again to skip'))break;
      try{if(o.kind==='extra')await store.remove('schedule',o.exId);
        else await store.put('schedule',`${o.customerId}_${o.origDate}`,{customerId:o.customerId,kind:'skipped',originalDate:o.origDate,date:o.origDate});
        closeSheet();toast(o.kind==='extra'?'Visit cancelled':'Visit skipped');}catch(err){toast('That didn’t save. Try again.');}
      break;}
    case 'restore-occ':{const o=findOcc(a.dataset.key);if(!o)break;
      try{await store.remove('schedule',`${o.customerId}_${o.origDate}`);closeSheet();toast('Visit restored');}catch(err){toast('That didn’t save. Try again.');}break;}
    case 'mark-invoiced':{
      const I=S.inv,c=I.customerId,today=todayStr();
      const list=S.visits.filter(v=>v.customerId===c&&v.date>=I.from&&v.date<=I.to&&!v.invoiced&&!I.excluded.has(v.id));
      a.disabled=true;
      try{for(const v of list){const{id:vid,...rest}=clone(v);await store.put('visits',vid,{...rest,invoiced:true,invoicedOn:today});}
        toast(`${list.length} visit${list.length===1?'':'s'} marked as invoiced`);}
      catch(err){a.disabled=false;toast('Not all visits were updated. Try again.');}
      break;}
    case 'export':exportCsv();break;
  }
});
document.addEventListener('change',e=>{

  if(!k)return;
  if(k==='vf-customer'){const f=$('#visitForm');if(f.dataset.id)return;const c=S.customers[t.value];if(!c)return;
    f.querySelectorAll('[name=task]').forEach(x=>x.checked=(c.tasks||[]).includes(x.value));
    f.querySelector(`[name=labourType][value=${c.pricing==='fixed'?'fixed':'hourly'}]`).checked=true;
    f.elements.rate.value=c.rate!==''&&c.rate!=null?c.rate:S.settings.hourlyRate;f.elements.fixedPrice.value=c.price??'';updateVisitCalc(f);return;}
  if(k==='inv-customer'){I.customerId=t.value;I.from=null;I.to=null;I.excluded=new Set();}
  else if(k==='inv-from'){if(t.value)I.from=t.value;}
  else if(k==='inv-to'){if(t.value)I.to=t.value;}
  else if(k==='inv-show')I.showInvoiced=t.checked;

document.addEventListener('submit',async e=>{
  const f=e.target;if(f.id==='loginForm')return;e.preventDefault();
  if(f.id==='visitForm')saveVisit(f);
  else if(f.id==='custForm')saveCustomer(f);
  else if(f.id==='apptForm')saveAppt(f);
  else if(f.id==='payForm')savePayment(f);
  else if(f.id==='settingsForm'){
    const fd=new FormData(f);
    const tasks=uniq(String(fd.get('tasks')||'').split('\n').map(s=>s.trim()));
    const materials=String(fd.get('materials')||'').split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{const i=line.lastIndexOf(',');
      if(i<0)return{name:line,price:0};const p=parseFloat(line.slice(i+1).replace(/[£\s]/g,''));return isNaN(p)?{name:line,price:0}:{name:line.slice(0,i).trim(),price:p};});
    const g=k=>String(fd.get(k)||'').trim();
    const next={...clone(S.settings),businessName:g('businessName'),hourlyRate:parseFloat(fd.get('hourlyRate'))||0,tasks,materials,
      address:g('address'),phone:g('phone'),email:g('email'),bankName:g('bankName'),sortCode:g('sortCode'),accountNumber:g('accountNumber'),
      paymentDays:parseInt(fd.get('paymentDays'),10)||0,invoicePrefix:g('invoicePrefix'),nextInvoice:Math.max(1,parseInt(fd.get('nextInvoice'),10)||1),invoiceFooter:g('invoiceFooter')};
    const btn=f.querySelector('[type=submit]');btn.disabled=true;
    try{document.activeElement&&document.activeElement.blur();await saveSettings(next);toast('Settings saved');}catch(err){toast('That didn’t save. Try again.');}
    finally{if(btn.isConnected)btn.disabled=false;}
  }
});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});

/* ---------- start ---------- */
const SB=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
S.downloads={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}};
function showLogin(msg){
  document.body.classList.add('signed-out');$('#timerSlot').innerHTML='';
  $('#view').innerHTML=`<form class="login" id="loginForm"><h2>Sign in</h2><p>Enter your email and we’ll send you a sign-in link. Open it on this phone or computer.</p>
  <label class="f">Email<input name="email" type="email" required autocomplete="email" inputmode="email"></label>
  <div class="actions"><button class="btn primary" type="submit">Email me a sign-in link</button></div>${msg?`<p style="margin-top:14px">${esc(msg)}</p>`:''}</form>`;
  $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();e.stopPropagation();const f=e.target,btn=f.querySelector('button');btn.disabled=true;
    const email=String(new FormData(f).get('email')).trim();
    const{error}=await SB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});
    if(error){btn.disabled=false;toast(error.message);return;}
    f.innerHTML=`<h2>Check your email</h2><p>We’ve sent a sign-in link to <strong>${esc(email)}</strong>. Tap it and the app will open signed in. It can take a minute to arrive, so check your spam folder too.</p><div class="actions"><button class="btn" type="button" onclick="location.reload()">Use a different email</button></div>`;
  },true);
}
async function claimImport(uid){
  const{data,error}=await SB.from('import_inbox').select('tbl,id,data');if(error||!data||!data.length)return 0;
  for(const r of data){
    const q=r.tbl==='settings'?SB.from('settings').upsert({owner_id:uid,data:r.data},{onConflict:'owner_id'})
      :SB.from(r.tbl).upsert({owner_id:uid,id:r.id,data:r.data},{onConflict:'owner_id,id',ignoreDuplicates:true});
    const{error:e}=await q;if(e)throw e;
  }
  await SB.from('import_inbox').delete().neq('id','');
  return data.length;
}
let started=false;
async function startApp(session){
  if(started)return;started=true;
  document.body.classList.remove('signed-out');
  const uid=session.user.id;S.userEmail=session.user.email;
  try{const n=await claimImport(uid);if(n)toast('Your customers and settings have been moved across');}catch(e){toast('Couldn’t move your old records across yet. Reload to try again.');}
  store=makeSupabaseStore(SB,uid);
  const got={c:false,v:false};
  const maybeReady=()=>{if(got.c&&got.v&&!S.ready){S.ready=true;}render();};
  render(true);
  store.watch({
    customers:list=>{const m={};for(const c of list)m[c.id]=c;S.customers=m;got.c=true;maybeReady();},
    visits:list=>{S.visits=list;got.v=true;maybeReady();},
    schedule:list=>{S.schedule=list;render();},
    invoices:list=>{S.invoices=list;render();},
    settings:s=>{S.settings={...defaultSettings(),...(s?clone(s):{})};render();}},
    e=>{if(e&&/not allowed|permission|JWT|row-level/i.test(e.message||''))toast('This email isn’t set up to use the app.');else toast('Lost the connection to your records. Reload the page to reconnect.');});
}
(async()=>{
  const{data:{session}}=await SB.auth.getSession();
  if(session)startApp(session);else{
    const err=new URLSearchParams(location.hash.slice(1)).get('error_description');
    showLogin(err?`That link didn’t work (${err}). Ask for a new one.`:'');}
  SB.auth.onAuthStateChange((ev,s)=>{if(s&&!started)startApp(s);if(ev==='SIGNED_OUT')location.reload();});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
</script>
