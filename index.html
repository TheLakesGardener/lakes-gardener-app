<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gardening app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F2F7F8;--surface:#FFFFFF;--surface-2:#E8F1F3;--ink:#0F2328;--muted:#4B646C;--line:#DCE7EA;--moss:#0B6672;--on-moss:#FFFFFF;--tint:#DDF0F2;--fern:#2F7D4F;--lime:#F2B544;--due:#8A5A00;--over:#B42318;--word:#0F2328;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:92px;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
h1,h2,h3{font-family:"Lato","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.logo-row{margin-top:8px}.logo-prev{max-width:220px;max-height:110px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.brand img{max-width:150px;max-height:56px;width:auto;height:auto;flex-shrink:0}.top h1{font-family:"Lato",system-ui,sans-serif;font-weight:700;font-size:1.2rem;letter-spacing:.08em;text-transform:uppercase;color:var(--word)}
#note:empty,#timerSlot:empty{display:none}
#note{font-size:.88rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
main{max-width:720px;margin:0 auto;padding:0 16px 24px}
.page-title{font-size:1.5rem}
.round-head h2{font-size:1.6rem;letter-spacing:-.015em}
.round-head p{margin-top:4px}
.group>h2{font-size:.98rem;margin:24px 0 2px;color:var(--muted);font-weight:600}
.group.over>h2{color:var(--over)}
.stop{display:grid;grid-template-columns:40px 1fr;column-gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.lawn{width:40px;height:46px;fill:var(--fern);grid-row:span 2}
.lawn line{stroke:var(--line);stroke-width:2}
.stop-main{cursor:pointer;min-width:0}
.stop h3{font-size:1.12rem;font-weight:600}
.addr{margin-top:2px;color:var(--muted);font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{margin-top:4px;font-size:.92rem;display:flex;flex-wrap:wrap;gap:2px 12px}
.status{font-weight:700}
.stop.over .status{color:var(--over)}
.stop.due .status{color:var(--due)}
.stop-actions{grid-column:2;display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:999px;border:1.5px solid var(--moss);background:transparent;color:var(--moss);padding:10px 18px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--moss);color:var(--on-moss)}
.btn.small{padding:6px 14px;min-height:40px;font-size:.92rem}
.btn.warn{border-color:var(--over);color:var(--over)}
.btn.light{border-color:var(--on-moss);color:var(--on-moss)}
.btn:disabled{opacity:.4;cursor:default}
.icon{background:none;border:0;font:inherit;font-size:1.5rem;line-height:1;color:var(--muted);min-width:44px;min-height:44px;cursor:pointer;border-radius:10px}
.icon.light{color:var(--on-moss)}
:focus-visible{outline:3px solid var(--fern);outline-offset:2px}
.timer{display:flex;align-items:center;gap:10px;background:var(--moss);color:var(--on-moss);border-radius:14px;padding:10px 8px 10px 14px}
.timer>div{flex:1;min-width:0;font-size:.92rem}
.timer strong{font-size:1rem}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 10px;flex-wrap:wrap}
.seg-btns{display:flex;gap:6px;margin-bottom:6px}
.seg-btns button{font:inherit;font-size:.92rem;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.seg-btns button[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--on-moss);font-weight:700}
.month{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 2px;color:var(--muted);font-size:.95rem}
.month h3{font-size:1rem;font-weight:600;color:var(--ink)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.item-main{min-width:0}
.item-main strong{display:block}
.item-sub{display:block;color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-end{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--fern);border-color:var(--fern)}.badge.bad{color:var(--over);border-color:var(--over)}.ready{margin:10px 0 6px}.ready h3{font-size:1rem;margin-bottom:2px}.item.on strong{color:var(--moss)}.section-h{font-size:1.2rem;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}details.f summary{cursor:pointer;font-weight:700}a.btn{text-decoration:none;display:inline-flex;align-items:center}
.empty{padding:36px 0}
.empty h2{font-size:1.6rem;margin-bottom:8px}
.empty p{color:var(--muted);margin-bottom:18px;max-width:34em}
label.f,fieldset.f{display:block;margin:14px 0 0;font-weight:700;font-size:.92rem;border:0;padding:0}
fieldset.f legend{padding:0;font-weight:700}
.hint{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;font-weight:400;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;margin-top:6px;min-height:44px}
textarea{resize:vertical;max-width:100%}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{position:relative;font-weight:400}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:.92rem;cursor:pointer;background:var(--surface)}
.chip input:checked+span{background:var(--moss);border-color:var(--moss);color:var(--on-moss);font-weight:700}
.chip input:focus-visible+span{outline:3px solid var(--fern);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:.95rem}
.mat-row{display:grid;grid-template-columns:1fr 62px 86px 44px;gap:6px;align-items:end}
.hm-field{margin-top:14px}
.part-row{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;margin-top:8px}
.pr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.part-item{margin:2px 0 6px;grid-template-columns:1fr 1fr}
.part-item .pick-wrap{grid-column:1/-1}
.part-item>span{display:none}
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pr-grid .hm{grid-column:span 2;margin-top:0}
.pr-grid input{margin-top:0}
.done-btn{border-color:var(--fern);color:var(--fern);font-weight:700}
.quick{margin-top:14px}
.quick .qlabel{display:block;font-weight:700;font-size:.92rem}
.quick-wrap{display:flex;gap:12px;align-items:flex-start;margin-top:8px}
.quick-wrap .dur{margin-top:0;flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.quick-wrap .dur-add{flex:0 0 74px;grid-template-columns:1fr;padding-left:12px;border-left:1.5px solid var(--line)}
.quick-wrap .dur button{min-width:0;padding:6px 4px}
.quick .dur button{min-width:56px;font-weight:600}
.dur button[aria-pressed=true]{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--moss);text-decoration:underline;cursor:pointer;font-weight:600}
.hm{display:flex;align-items:center;gap:6px;margin-top:6px}
.hm input{width:72px;margin-top:0;text-align:center}
.hm span{font-weight:600;color:var(--muted)}
.save-new{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:.92rem;font-weight:400}
.save-new select{width:auto;margin-top:0;min-height:40px;padding:6px 10px}
.items-sum{margin-top:8px;font-size:.92rem;color:var(--muted)}
form[data-lt="hourly"] .only-fixed,form[data-lt="fixed"] .only-hourly,
form[data-pr="hourly"] .only-fixed,form[data-pr="fixed"] .only-hourly,
form[data-lt="contract"] .only-hourly,form[data-lt="contract"] .only-fixed,
form[data-pr="monthly"] .only-hourly,form[data-pr="monthly"] .only-fixed,
form:not([data-pr="monthly"]) .only-monthly{display:none}
.pick-wrap{position:relative;min-width:0}
.picker{position:absolute;left:0;top:calc(100% + 4px);z-index:40;width:min(420px,calc(100vw - 48px));max-height:300px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:4px 0}
.picker h4{margin:0;padding:8px 12px 2px;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.picker button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:10px 12px;min-height:44px;border:0;background:none;color:var(--ink);font:inherit;font-size:.95rem;text-align:left;cursor:pointer}
.picker button span:last-child{color:var(--muted);flex-shrink:0}
.picker button:hover,.picker button[aria-selected="true"]{background:var(--surface-2)}
.picker .none{padding:10px 12px;color:var(--muted);font-size:.9rem}
.dur{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dur button{font:inherit;font-size:.9rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer}
.dur button:hover{border-color:var(--moss)}
.practice{align-items:flex-start;border:1.5px dashed var(--due);border-radius:12px;padding:10px 12px;font-size:.9rem}.practice input{margin-top:3px}
.badge.test{color:var(--due);border-color:var(--due)}
.warnbox{border:1.5px solid var(--due);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:.92rem}
.totals{margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.totals div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.totals .grand{font-family:"Lato",system-ui,sans-serif;font-size:1.35rem;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem;cursor:pointer}
.pick input{width:22px;height:22px;accent-color:var(--moss)}
.pick-main{min-width:0}.pick-main strong{display:block}
.summary{font-size:.9rem;line-height:1.45;min-height:220px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.section{margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
.section h2{font-size:1.2rem;margin-bottom:6px}
.history{margin-top:18px}
.history h3{font-size:1rem;margin-bottom:4px}
.cal-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.cal-title{font-size:1.45rem;letter-spacing:-.015em;flex:1;min-width:9em}
.cal-sum{flex:1;font-size:.9rem;min-width:8em}
.daylink{background:none;border:0;font:inherit;color:inherit;padding:0;cursor:pointer;font-weight:600}
.week{display:flex;flex-direction:column}
.day{padding:10px 0 6px;border-bottom:1px solid var(--line)}
.day h3{font-size:1rem;margin-bottom:6px}
.day.today h3{color:var(--moss)}
.day.today h3 .daylink::after{content:" (today)";font-weight:400}
.day .none{color:var(--muted);font-size:.88rem;margin-bottom:4px}
.appt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--moss);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.appt .t{display:block;font-size:.84rem;color:var(--muted)}
.appt strong{display:block;font-size:1rem;font-weight:700}
.appt .sub{display:block;font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .flag{font-weight:700}
.appt.completed{border-left-color:var(--lime)}.appt.completed strong,.appt.completed .sub{opacity:.7}.appt.completed .flag{color:var(--fern)}
.appt.missed{border-left-color:var(--over)}.appt.missed .flag{color:var(--over)}
.appt.extra{border-left-color:var(--due)}
.appt.skipped{border-left-color:var(--line);opacity:.6}.appt.skipped strong{text-decoration:line-through}
.alert{border:1.5px solid var(--over);border-radius:14px;padding:12px 12px 6px;margin-bottom:14px}
.alert h3{font-size:1.05rem;color:var(--over)}
.alert p{margin-bottom:8px}
.detail p{margin-top:8px}
.detail a{color:var(--moss);font-weight:700}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dow{font-size:.78rem;color:var(--muted);padding:4px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mcell{min-height:62px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;background:var(--surface);font:inherit;text-align:left;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcell.out{background:transparent;color:var(--muted)}
.dnum{font-size:.84rem;font-weight:700;align-self:flex-start;padding:0 5px;border-radius:999px}
.mcell.today .dnum{background:var(--moss);color:var(--on-moss)}
.mdots{display:flex;gap:3px;flex-wrap:wrap;padding-left:3px}
.mdot{width:8px;height:8px;border-radius:50%;background:var(--moss)}
.mdot.completed{background:var(--lime)}.mdot.missed{background:var(--over)}.mdot.extra{background:var(--due)}
.mname{display:none;font-size:.74rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--moss);padding-left:4px}
.mname.completed{border-color:var(--lime);color:var(--muted)}.mname.missed{border-color:var(--over)}
@media (min-width:700px){.mname{display:block}.mdots{display:none}.mcell{min-height:92px}}
@media (min-width:980px){
  main.wide{max-width:1200px}
  main.wide .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  main.wide .day{border:1px solid var(--line);border-radius:12px;padding:8px;min-height:200px}
  main.wide .day.today{border-color:var(--lime);border-width:2px}
  main.wide .appt{padding:6px 8px}
}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto}
.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:.74rem;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;min-height:52px;cursor:pointer}
.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--moss);font-weight:700}
.sheet{position:fixed;inset:0;z-index:20}
.sheet[hidden]{display:none}
.sheet-back{position:absolute;inset:0;background:rgba(8,16,11,.5)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:0 18px calc(28px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:14px 0 6px;z-index:1}
.sheet-head h2{font-size:1.35rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.login{max-width:420px;margin:40px auto 0}.login h2{font-size:1.6rem;margin-bottom:8px}.login p{color:var(--muted);margin-bottom:10px}
body.signed-out .tabs{display:none}
@media (max-width:380px){.row3{grid-template-columns:1fr 1fr}.row3 label:last-child{grid-column:span 2}}
/* ---------- new look (Harbour, light) ---------- */
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:96px}
h1,h2,h3,.page-title,.cal-title,.round-head h2,.sheet-head h2,.empty h2,.login h2{font-family:var(--display);letter-spacing:-.02em}
.page-title{font-size:1.75rem}
.round-head h2,.cal-title{font-size:1.8rem}
.top{padding:16px 16px 10px}
.top h1{font-family:var(--display);font-size:1.15rem;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.brand img{max-height:48px}
.btn{border-radius:14px;min-height:48px;padding:10px 18px;border:1.5px solid var(--line);color:var(--ink);background:var(--surface)}
.btn:hover{border-color:var(--moss)}
.btn.primary{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.btn.primary:hover{background:#09545E;border-color:#09545E}
.btn.small{min-height:40px;border-radius:12px;padding:6px 14px}
.btn.warn{border-color:#F1C7C2;color:var(--over);background:var(--surface)}
.btn.light{border-color:rgba(255,255,255,.6);color:var(--on-moss);background:transparent}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.timer{border-radius:16px;padding:12px 10px 12px 16px}
.seg-btns{background:var(--surface-2);padding:4px;border-radius:12px;gap:4px;display:inline-flex}
.seg-btns button{border:0;border-radius:9px;min-height:38px}
.seg-btns button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,35,40,.12)}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}
.lawn{fill:var(--moss)}
.stop h3{font-family:var(--display);font-size:1.2rem}
.group>h2{font-family:"Figtree",sans-serif;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;margin-top:22px}
.item{padding:13px 4px}
.item.on{background:var(--tint);border-radius:12px;padding:13px 10px}
.badge{border:0;background:var(--surface-2);color:var(--muted);padding:3px 10px}
.badge.ok{background:#E2F2E8;color:var(--fern)}
.badge.bad{background:#FDE7E4;color:var(--over)}
.badge.test{background:#FFF1D6;color:var(--due)}
input,select,textarea{border-radius:12px;border-color:var(--line);min-height:48px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--moss);box-shadow:0 0 0 3px var(--tint)}
.chip span{border-color:var(--line)}
.dur button{border-radius:12px}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GBP=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});
const gbp=n=>GBP.format(Number(n)||0);
const pad=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function localDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function localTime(d){return `${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function toUTC(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);}
function fromUTC(t){const d=new Date(t);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;}
function addDays(s,n){return fromUTC(toUTC(s)+n*864e5);}
function addMonths(s,n){const [y,m,d]=s.split('-').map(Number);const last=new Date(Date.UTC(y,m-1+n+1,0)).getUTCDate();return fromUTC(Date.UTC(y,m-1+n,Math.min(d,last)));}
function daysBetween(a,b){return Math.round((toUTC(b)-toUTC(a))/864e5);}
function niceDate(s,o){return new Date(toUTC(s)).toLocaleDateString('en-GB',{...(o||{day:'numeric',month:'short'}),timeZone:'UTC'});}
function minsBetween(a,b){if(!a||!b)return 0;const[h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let m=(h2*60+m2)-(h1*60+m1);if(m<0)m+=1440;return m;}
function hmBox(name,mins,label,hint){mins=Math.max(0,Math.round(Number(mins)||0));const h=Math.floor(mins/60),m=mins%60;
  return `<div class="f hm-field"><label class="f" style="margin:0" for="hm-${name}">${label}${hint?` <span class="hint">${hint}</span>`:''}</label><div class="hm"><input id="hm-${name}" type="number" data-hm="h" data-for="${name}" min="0" max="23" inputmode="numeric" value="${mins?h:''}" placeholder="0" aria-label="${label}, hours"><span>h</span><input type="number" data-hm="m" data-for="${name}" min="0" max="59" step="5" inputmode="numeric" value="${mins?m:''}" placeholder="0" aria-label="${label}, minutes"><span>m</span></div><input type="hidden" name="${name}" value="${mins||''}"></div>`;}
function quickDur(label){return `<div class="f quick"><span class="qlabel">${label}</span><div class="quick-wrap"><div class="dur" aria-label="${label}">${[1,2,3,4,5,6,7,8].map(h=>`<button type="button" data-action="dur" data-m="${h*60}">${h}h</button>`).join('')}</div><div class="dur dur-add" aria-label="Add minutes">${[15,30,45].map(m=>`<button type="button" data-action="dur" data-add="${m}">+${m}m</button>`).join('')}</div></div></div>`;}
function setDur(form,name,mins){mins=Math.max(0,Math.round(Number(mins)||0));const hid=form.elements[name];if(!hid)return;hid.value=mins||'';
  const hh=form.querySelector(`[data-hm=h][data-for="${name}"]`),mm=form.querySelector(`[data-hm=m][data-for="${name}"]`);
  if(hh)hh.value=mins?Math.floor(mins/60):'';if(mm)mm.value=mins?mins%60:'';}
function readDur(form,name){const hh=form.querySelector(`[data-hm=h][data-for="${name}"]`),mm=form.querySelector(`[data-hm=m][data-for="${name}"]`);
  const v=(parseInt(hh&&hh.value,10)||0)*60+(parseInt(mm&&mm.value,10)||0);form.elements[name].value=v||'';return v;}
function fmtMins(m){m=Math.round(m||0);if(!m)return '0m';const h=Math.floor(m/60),r=m%60;return h?`${h}h${r?` ${r}m`:''}`:`${r}m`;}
const r2=x=>Math.round((Number(x)||0)*100)/100;

const FREQ={weekly:{d:7,l:'Weekly'},fortnightly:{d:14,l:'Fortnightly'},'3-weekly':{d:21,l:'Every 3 weeks'},'4-weekly':{d:28,l:'Every 4 weeks'},monthly:{d:30,l:'Monthly'},'6-weekly':{d:42,l:'Every 6 weeks'},'one-off':{d:0,l:'One-off job'}};
const DEFAULT_TASKS=['Lawn mowing','Edging','Hedge trimming','Weeding','Pruning','Border tidy','Leaf clearing','Green waste removal','Planting','Pressure washing'];
function defaultSettings(){return{businessName:'',hourlyRate:0,address:'',phone:'',email:'',bankName:'',sortCode:'',accountNumber:'',paymentDays:14,invoicePrefix:'TLG-',nextInvoice:1,invoiceFooter:'Thank you for your custom.',tasks:DEFAULT_TASKS.slice(),materials:[{name:'Compost (bag)',price:0},{name:'Bark mulch (bag)',price:0},{name:'Green waste disposal',price:0}],timer:null};}

/* ---------- state ---------- */
const S={customers:{},visits:[],settings:defaultSettings(),ready:false,tab:'schedule',visitFilter:'all',schedule:[],invoices:[],invView:'new',cal:{view:'week',date:null},
  inv:{customerId:null,from:null,to:null,excluded:new Set(),showInvoiced:false,text:'',extras:[],month:null},downloads:null};
let store=null,pending=false;
const APP_VERSION='2026-10-15-6';let updateWaiting=null;
function applyUpdate(v){
  if(!$('#sheet').hidden){updateWaiting=v;return;}
  let tried=false;try{const k='gr-reload-'+v;tried=!!sessionStorage.getItem(k);sessionStorage.setItem(k,'1');}catch(e){}
  if(!tried){location.reload();return;}
  const n=$('#note');n.innerHTML='A new version of the app is ready. <button class="btn small" data-action="reload-app">Reload now</button>';
}

async function checkUpdate(){
  if(location.protocol==='file:')return;
  try{const r=await fetch('./?v='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION)applyUpdate(m[1]);}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate();});
window.addEventListener('pageshow',()=>checkUpdate());setInterval(checkUpdate,30*60*1000);
/* ---------- storage adapters ---------- */
const SB_URL='https://vrhxjbureynpkrohbnww.supabase.co',SB_KEY='sb_publishable_1GrmYyopoMB1bNIldUpI4w_wKQfw0_z';
const TABLE={customers:'customers',visits:'visits',schedule:'schedule_items',invoices:'invoices'};
function makeSupabaseStore(sb,uid){
  const cache={customers:new Map(),visits:new Map(),schedule:new Map(),invoices:new Map()};let settings=null,h=null;
  const list=k=>[...cache[k].values()];
  const emit=k=>{if(h)h[k](list(k));};
  async function load(k){const m=new Map();let from=0;for(;;){const{data,error}=await sb.from(TABLE[k]).select('id,data').range(from,from+999);if(error)throw error;
    for(const r of data)m.set(r.id,{...r.data,id:r.id});if(data.length<1000)break;from+=1000;}cache[k]=m;emit(k);}
  return{kind:'cloud',
    async watch(handlers,onErr){h=handlers;
      let ch=null,gen=0,retry=null,wait=2000,down=false;
      const reloadAll=()=>Promise.all([...Object.keys(TABLE).map(load),
        sb.from('settings').select('data').maybeSingle().then(({data,error})=>{if(error)throw error;settings=data?data.data:null;h.settings(settings);})]);
      const connect=()=>{const my=++gen;
        if(ch){try{sb.removeChannel(ch);}catch(e){}}
        ch=sb.channel('lg-'+uid+'-'+my);
        for(const k of Object.keys(TABLE))ch.on('postgres_changes',{event:'*',schema:'public',table:TABLE[k],filter:`owner_id=eq.${uid}`},p=>{
          if(p.eventType==='DELETE'){if(p.old&&p.old.id)cache[k].delete(p.old.id);}else cache[k].set(p.new.id,{...p.new.data,id:p.new.id});emit(k);});
        ch.on('postgres_changes',{event:'*',schema:'public',table:'settings',filter:`owner_id=eq.${uid}`},p=>{if(p.new&&p.new.data){settings=p.new.data;h.settings(settings);}});
        ch.subscribe(st=>{if(my!==gen)return;
          if(st==='SUBSCRIBED'){wait=2000;if(down){down=false;reloadAll().catch(()=>{});}}
          else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){down=true;later();}});};
      const later=()=>{if(retry)return;retry=setTimeout(()=>{retry=null;if(document.visibilityState==='visible'&&navigator.onLine!==false)connect();else down=true;},wait);wait=Math.min(wait*2,30000);};
      const wake=()=>{if(document.visibilityState!=='visible')return;reloadAll().catch(()=>{});
        if(down||!ch||ch.state==='closed'||ch.state==='errored'){clearTimeout(retry);retry=null;wait=2000;connect();}};
      connect();
      try{await reloadAll();}
      catch(e){if(e&&/not allowed|permission|JWT|row-level/i.test(e.message||''))onErr&&onErr(e);else{down=true;later();}}
      document.addEventListener('visibilitychange',wake);window.addEventListener('online',wake);window.addEventListener('focus',wake);
    },
    async put(k,id,o){const{id:_,...d}=clone(o);cache[k].set(id,{...d,id});emit(k);
      const{error}=await sb.from(TABLE[k]).upsert({owner_id:uid,id,data:d},{onConflict:'owner_id,id'});if(error)throw error;},
    async remove(k,id){cache[k].delete(id);emit(k);const{error}=await sb.from(TABLE[k]).delete().eq('id',id);if(error)throw error;},
    async putSettings(o){settings=clone(o);const{error}=await sb.from('settings').upsert({owner_id:uid,data:settings},{onConflict:'owner_id'});if(error)throw error;}};
}
function makeLocalStore(){
  const KEY='garden-round-v1';let data={};
  try{data=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){}
  data.customers=data.customers||{};data.visits=data.visits||{};data.schedule=data.schedule||{};data.invoices=data.invoices||{};data.settings=data.settings||null;
  let cb=null;
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}};
  const list=o=>Object.entries(o).map(([id,v])=>({...v,id}));
  const emit=()=>{if(!cb)return;cb.customers(list(data.customers));cb.visits(list(data.visits));cb.schedule(list(data.schedule));cb.invoices(list(data.invoices));cb.settings(data.settings);};
  return{kind:'local',
    watch(h){cb=h;emit();},
    async put(k,id,o){data[k][id]=clone(o);save();emit();},
    async remove(k,id){delete data[k][id];save();emit();},
    async putSettings(o){data.settings=clone(o);save();emit();}};
}

/* ---------- derived ---------- */
const custName=id=>S.customers[id]?.name||'Removed customer';
const sortedCustomers=()=>Object.values(S.customers).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
function visitTotals(v){
  const mins=Number(v.minutes)||0;
  const labour=v.labourType==='contract'?0:v.labourType==='fixed'?Number(v.fixedPrice)||0:(mins/60)*(Number(v.rate)||0);
  const materials=(v.materials||[]).reduce((s,m)=>s+(Number(m.qty)||0)*(Number(m.price)||0),0);
  return{mins,labour:r2(labour),materials:r2(materials),total:r2(r2(labour)+r2(materials))};
}
function lastVisitDate(cid){let d=null;for(const v of S.visits)if(v.customerId===cid&&(!d||v.date>d))d=v.date;return d;}
function schedule(c){
  const f=FREQ[c.frequency]||FREQ.fortnightly,last=lastVisitDate(c.id),today=todayStr();
  let due;
  if(c.nextDue&&(!last||c.nextDue>last))due=c.nextDue;
  else if(!last)due=today;
  else if(!f.d)return{last,due:null,freq:0};
  else due=c.frequency==='monthly'?addMonths(last,1):addDays(last,f.d);
  return{last,due,inDays:daysBetween(today,due),since:last?daysBetween(last,today):null,freq:f.d};
}
const ltFor=c=>c&&c.pricing==='fixed'?'fixed':c&&c.pricing==='monthly'?'contract':'hourly';
function pricingLabel(c){if(c.pricing==='monthly')return `${gbp(c.monthly)} a month (contract)`;return c.pricing==='fixed'?`${gbp(c.price)} per visit`:`${gbp(c.rate!==''&&c.rate!=null?c.rate:S.settings.hourlyRate)} an hour`;}

/* ---------- rendering ---------- */
function render(force){
  $('#bizName').textContent=S.settings.businessName||'Your business';document.title=S.settings.businessName||'Gardening app';
  {const lg=$('#bizLogo'),src=S.settings.logo&&S.settings.logo.png||'';if(lg.getAttribute('src')!==src)lg.setAttribute('src',src);lg.hidden=!src;}
  renderTimer();
  if(!$('#note').querySelector('[data-action=reload-app]'))$('#note').textContent='';
  document.querySelectorAll('.tabs button').forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const ae=document.activeElement;
  if(!force&&ae&&$('#view').contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)){pending=true;return;}
  pending=false;
  $('#view').classList.toggle('wide',S.tab==='schedule');$('.top').classList.toggle('wide',S.tab==='schedule');
  $('#view').innerHTML=VIEWS[S.tab]();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&$('#sheet').hidden)render();},0));

function elapsed(iso){return fmtMins(Math.max(0,Math.floor((Date.now()-Date.parse(iso))/60000)));}
function renderTimer(){
  const t=S.settings.timer,slot=$('#timerSlot');
  if(!t){slot.innerHTML='';return;}
  slot.innerHTML=`<div class="timer"><div><strong>${esc(custName(t.customerId))}</strong><br>On the job for <span id="elapsed">${elapsed(t.start)}</span></div><button class="btn small light" data-action="stop-timer">Stop and log</button><button class="icon light" data-action="discard-timer" aria-label="Discard timer">×</button></div>`;
}
setInterval(()=>{const el=$('#elapsed');if(el&&S.settings.timer)el.textContent=elapsed(S.settings.timer.start);},15000);

/* ---------- schedule ---------- */
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function dow(s){return (new Date(toUTC(s)).getUTCDay()+6)%7;}
function addMins(t,m){const[h,mm]=t.split(':').map(Number);const x=(((h*60+mm+(Number(m)||0))%1440)+1440)%1440;return `${pad(Math.floor(x/60))}:${pad(x%60)}`;}
function freqStep(c){return (FREQ[c.frequency]||FREQ.fortnightly).d;}
function patternLabel(c){const f=FREQ[c.frequency]||FREQ.fortnightly;let s=f.l;if(c.day!==''&&c.day!=null&&f.d)s+=` on ${DAYS[c.day]}s`;if(c.startTime)s+=` at ${c.startTime}`;return s;}
function anchorFor(c){
  if(c.nextDue)return c.nextDue;
  const d=freqStep(c),last=lastVisitDate(c.id);
  if(last&&d)return c.frequency==='monthly'?addMonths(last,1):addDays(last,d);
  return todayStr();
}
function visitIndex(){const keys=new Map(),byDay=new Map();for(const v of S.visits){if(v.scheduledKey)keys.set(v.scheduledKey,v);byDay.set(v.customerId+'|'+v.date,v);}return{keys,byDay};}
function occurrencesInRange(a,b){
  const today=todayStr(),idx=visitIndex(),out=[],exMap=new Map();
  for(const e of S.schedule)if(e.kind!=='extra')exMap.set(`${e.customerId}_${e.originalDate}`,e);
  const push=o=>{const c=S.customers[o.customerId];o.start=o.start||'';o.duration=Number(o.duration)||Number(c&&c.duration)||60;
    const v=idx.keys.get(o.key)||idx.byDay.get(o.customerId+'|'+o.date);o.visitId=v?v.id:null;
    if(!o.status)o.status=v?'completed':o.date<today?'missed':'scheduled';out.push(o);};
  for(const c of Object.values(S.customers)){
    if(c.status==='paused')continue;
    const step=freqStep(c),anchor=anchorFor(c);
    const mk=orig=>{if(orig<a||orig>b)return;const ex=exMap.get(`${c.id}_${orig}`);if(ex&&ex.kind==='moved')return;
      push({key:`r:${c.id}:${orig}`,kind:'regular',customerId:c.id,origDate:orig,date:orig,start:c.startTime,duration:c.duration,status:ex&&ex.kind==='skipped'?'skipped':null});};
    if(!step){if(c.nextDue||!S.visits.some(v=>v.customerId===c.id))mk(anchor);continue;}
    if(c.frequency==='monthly'){for(let k=0;k<600;k++){const d=addMonths(anchor,k);if(d>b)break;mk(d);}}
    else{let k=Math.max(0,Math.floor(daysBetween(anchor,a)/step));for(let n=0;n<400;n++,k++){const d=addDays(anchor,k*step);if(d>b)break;mk(d);}}
  }
  for(const e of S.schedule){
    if(e.date<a||e.date>b||!S.customers[e.customerId])continue;
    if(e.kind==='moved')push({key:`r:${e.customerId}:${e.originalDate}`,kind:'regular',moved:e.date!==e.originalDate,edited:true,customerId:e.customerId,origDate:e.originalDate,date:e.date,start:e.start,duration:e.duration,exId:e.id,notes:e.notes,items:e.items||[]});
    else if(e.kind==='extra')push({key:`x:${e.id}`,kind:'extra',customerId:e.customerId,date:e.date,start:e.start,duration:e.duration,exId:e.id,notes:e.notes,items:e.items||[],partOf:e.partOf||'',part:e.part||0,task:e.task||''});
  }
  return out.sort((x,y)=>x.date.localeCompare(y.date)||(x.start||'99').localeCompare(y.start||'99')||custName(x.customerId).localeCompare(custName(y.customerId)));
}
function findOcc(key){
  if(!key)return null;
  if(key.startsWith('x:')){const e=S.schedule.find(x=>x.id===key.slice(2));return e?occurrencesInRange(e.date,e.date).find(o=>o.key===key)||null:null;}
  const[,cid,orig]=key.split(':');const e=S.schedule.find(x=>x.customerId===cid&&x.originalDate===orig&&x.kind==='moved');
  const d=e?e.date:orig;return occurrencesInRange(d,d).find(o=>o.key===key)||null;
}
function weekStart(s){return addDays(s,-dow(s));}
function calDate(){return S.cal.date||(S.cal.date=todayStr());}
function shiftCal(n){const d=calDate(),v=S.cal.view;if(v==='day')return addDays(d,n);if(v==='week')return addDays(d,7*n);return addMonths(d.slice(0,8)+'01',n);}
function apptCard(o,showDate){
  const c=S.customers[o.customerId]||{};
  const time=o.start?`${o.start}–${addMins(o.start,o.duration)}`:'Any time';
  const flag={completed:'Done',missed:'Not logged',skipped:'Skipped'}[o.status]||(o.partOf?`Part ${o.part||2}${o.task?`: ${esc(o.task)}`:''}`:o.kind==='extra'?'Extra visit':o.moved?'Moved':(o.items||[]).length?'Extras':'');
  return `<button class="appt ${o.status}${o.kind==='extra'?' extra':''}" data-action="open-occ" data-key="${esc(o.key)}"><span class="t">${showDate?niceDate(o.date,{weekday:'short',day:'numeric',month:'short'})+', ':''}${time}${flag?` <span class="flag">${flag}</span>`:''}</span><strong>${esc(c.name||'Removed customer')}</strong>${c.address?`<span class="sub">${esc(c.address.split('\n')[0])}</span>`:''}</button>`;
}
function viewSchedule(){
  if(!S.ready)return `<p class="muted">Loading your schedule…</p>`;
  if(!Object.keys(S.customers).length)return `<section class="empty"><h2>Start your schedule</h2><p>Add your regular customers with how often and which day you visit. Their visits then fill the calendar automatically.</p><button class="btn primary" data-action="new-customer">Add a customer</button></section>`;
  const v=S.cal.view,d=calDate(),today=todayStr();
  let a,b,title;
  if(v==='day'){a=b=d;title=niceDate(d,{weekday:'long',day:'numeric',month:'long'});}
  else if(v==='week'){a=weekStart(d);b=addDays(a,6);title=`${niceDate(a,{day:'numeric',month:'short'})} to ${niceDate(b,{day:'numeric',month:'short',year:'numeric'})}`;}
  else{const m1=d.slice(0,8)+'01';a=weekStart(m1);b=addDays(weekStart(addDays(addMonths(m1,1),-1)),6);title=niceDate(m1,{month:'long',year:'numeric'});}
  const occ=occurrencesInRange(a,b),live=occ.filter(o=>o.status!=='skipped');
  const missed=occurrencesInRange(addDays(today,-30),addDays(today,-1)).filter(o=>o.status==='missed');
  let h=`<div class="cal-nav"><h2 class="cal-title">${title}</h2><div class="seg-btns">${['day','week','month'].map(x=>`<button data-action="cal-view" data-v="${x}" aria-pressed="${v===x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div>
  <div class="cal-nav"><button class="icon" data-action="cal-move" data-n="-1" aria-label="Previous ${v}">‹</button><button class="btn small" data-action="cal-today">Today</button><button class="icon" data-action="cal-move" data-n="1" aria-label="Next ${v}">›</button><span class="cal-sum muted">${v!=='month'?`${live.length} visit${live.length===1?'':'s'}, ${fmtMins(live.reduce((s,o)=>s+o.duration,0))} booked`:''}</span><button class="btn small primary" data-action="new-appt" data-d="${v==='day'?d:(today>=a&&today<=b?today:a)}">Schedule a visit</button></div>`;
  if(missed.length)h+=`<div class="alert"><h3>${missed.length} past visit${missed.length===1?'':'s'} not logged</h3><p class="muted">Tap one to log it, move it or skip it.</p>${missed.slice(0,6).map(o=>apptCard(o,true)).join('')}${missed.length>6?`<p class="muted">And ${missed.length-6} more.</p>`:''}</div>`;
  if(v==='day'&&S.cal.back)h=`<button class="btn small back-btn" data-action="cal-back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back to ${esc(S.cal.back.label)}</button>`+h;
  if(v==='day')h+=occ.length?occ.map(o=>apptCard(o)).join(''):`<p class="muted" style="margin-top:12px">Nothing booked for this day.</p>`;
  else if(v==='week'){h+='<div class="week">';for(let i=0;i<7;i++){const x=addDays(a,i),list=occ.filter(o=>o.date===x);
    h+=`<section class="day${x===today?' today':''}"><h3><button class="daylink" data-action="cal-day" data-d="${x}">${niceDate(x,{weekday:'short',day:'numeric',month:'short'})}</button></h3>${list.length?list.map(o=>apptCard(o)).join(''):'<p class="none">Nothing booked</p>'}</section>`;}h+='</div>';}
  else{const m=d.slice(0,7),by={};for(const o of live)(by[o.date]=by[o.date]||[]).push(o);
    h+=`<div class="month-grid">${DAYS.map(x=>`<div class="dow">${x.slice(0,3)}</div>`).join('')}`;
    for(let x=a;x<=b;x=addDays(x,1)){const list=by[x]||[];
      h+=`<button class="mcell${x.slice(0,7)!==m?' out':''}${x===today?' today':''}" data-action="cal-day" data-d="${x}" aria-label="${niceDate(x,{weekday:'long',day:'numeric',month:'long'})}, ${list.length} visit${list.length===1?'':'s'}"><span class="dnum">${Number(x.slice(8))}</span><span class="mdots">${list.map(o=>`<span class="mdot ${o.status}${o.kind==='extra'?' extra':''}"></span>`).join('')}</span>${list.slice(0,3).map(o=>`<span class="mname ${o.status}">${esc(custName(o.customerId))}</span>`).join('')}${list.length>3?`<span class="mname">+${list.length-3} more</span>`:''}</button>`;}
    h+='</div>';}
  return h;
}

  ${addr?`<p>${esc(addr)}<br><a href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(addr)}" target="_blank" rel="noopener">Directions</a></p>`:''}

  ${partList.length?`<p><span class="muted">This job:</span> ${partList.map(x=>`<button class="linkbtn" data-action="open-occ" data-key="${esc(x.k)}">${esc(x.label)} ${shortDate(x.date)}</button>`).join(', ')}</p>`:''}
  ${o.notes?`<p><span class="muted">Visit note:</span> ${esc(o.notes)}</p>`:''}
  ${(o.items||[]).length?`<div class="totals" style="margin-top:10px">${o.items.map(m=>`<div><span>${esc(m.name)}${m.qty!==1?` x ${fmtNum(m.qty)}`:''}</span><span>${m.price?gbp(r2(m.qty*m.price)):'price on the day'}</span></div>`).join('')}<div class="grand"><span>Line items for this visit</span><span>${gbp(itemsTotal(o.items))}</span></div></div>`:''}
  ${c.notes?`<p><span class="muted">Customer notes:</span> ${esc(c.notes)}</p>`:''}
  </div><div class="actions">${act}<button class="btn" data-action="edit-customer" data-id="${esc(o.customerId)}">Customer details</button></div>`);

function jobParts(key){return S.schedule.filter(e=>e.kind==='extra'&&e.partOf===key).sort((a,b)=>(a.part||0)-(b.part||0)||a.date.localeCompare(b.date));}
function jobDate(key){if(!key)return '';if(key.startsWith('r:'))return key.split(':')[2];const e=S.schedule.find(x=>x.id===key.slice(2));return e?e.date:'';}
const shortDate=d=>niceDate(d,{weekday:'short',day:'numeric',month:'short'});
function itemsTotal(items){return r2((items||[]).reduce((t,m)=>t+(Number(m.qty)||0)*(Number(m.price)||0),0));}
function readItems(box){return [...box.querySelectorAll('.mat-row')].map(r=>({name:r.querySelector('[name=mname]').value.trim(),qty:parseFloat(r.querySelector('[name=mqty]').value)||0,price:parseFloat(r.querySelector('[name=mprice]').value)||0})).filter(m=>m.name);}
function saveNewHtml(){return `<label class="save-new"><input type="checkbox" name="saveNew" checked> Save new items to my list as <select name="saveAs" aria-label="Save as"><option value="services">services</option><option value="materials">products</option></select></label>`;}
async function saveNewItems(form,items){
  const fd=new FormData(form);if(fd.get('saveNew')!=='on')return;
  const known=new Set(catalogue().map(x=>x.name.toLowerCase())),fresh=[];
  for(const m of items){const k=m.name.toLowerCase();if(!known.has(k)){known.add(k);fresh.push({name:m.name,price:m.price||0});}}
  if(!fresh.length)return;const as=fd.get('saveAs')==='materials'?'materials':'services';
  const next=clone(S.settings);next[as]=[...(next[as]||[]),...fresh];
  try{await saveSettings(next);}catch(e){}
}
function partRow(x){const d=x.duration||60;
  return `<div class="part-row" data-id="${esc(x.id||'')}"><div class="pr-top"><strong>${esc(x.label)}</strong>${x.done?`<span class="flag">Done</span>`:`<button type="button" class="icon" data-action="part-remove" aria-label="Remove this visit">×</button>`}</div>
  ${x.fixed?'':`<div class="mat-row part-item"><div class="pick-wrap"><input name="mname" autocomplete="off" placeholder="Main job" value="${esc(x.task||'')}" aria-label="What is this visit for" role="combobox" aria-expanded="false"${x.done?' disabled':''}></div><input name="mqty" type="number" inputmode="decimal" min="0" step="any" value="${esc(x.qty||1)}" aria-label="Quantity"${x.done?' disabled':''}><input name="mprice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="£ price" value="${esc(x.price||'')}" aria-label="Price"${x.done?' disabled':''}><span></span></div>`}
  ${x.fixed?`<p class="muted" style="margin:2px 0 0">${shortDate(x.date)}${x.start?`, ${esc(x.start)}`:''}</p>`:`<div class="pr-grid"><input type="date" name="pdate" value="${esc(x.date)}" aria-label="Date"${x.done?' disabled':''}><input type="time" name="pstart" value="${esc(x.start||'')}" aria-label="Start"${x.done?' disabled':''}><span class="hm"><input type="number" name="ph" min="0" max="23" inputmode="numeric" value="${Math.floor(d/60)}" aria-label="Hours"${x.done?' disabled':''}><span>h</span><input type="number" name="pm" min="0" max="59" step="5" inputmode="numeric" value="${d%60}" aria-label="Minutes"${x.done?' disabled':''}><span>m</span></span></div>`}</div>`;}
function partsSectionHtml(o){
  const root=o.partOf||o.key,rows=[];
  if(o.partOf){const r=findOcc(root);if(r)rows.push({label:'Started',date:r.date,start:r.start,fixed:true});}
  for(const e of jobParts(root)){if(`x:${e.id}`===o.key)continue;const done=S.visits.some(v=>v.scheduledKey===`x:${e.id}`);const it=(e.items||[])[0];rows.push({id:e.id,label:`Part ${e.part||2}`,date:e.date,start:e.start,duration:e.duration,done,task:e.task||'',qty:it&&it.name===e.task?it.qty:1,price:it&&it.name===e.task?it.price:''});}
  return `<fieldset class="f"><legend>Visits on this job <span class="hint">if the job runs over more than one day; say what each one is for</span></legend><div id="partRows" data-root="${esc(root)}">${rows.map(partRow).join('')}</div>
  <div class="actions" style="margin-top:10px"><button type="button" class="btn small" data-action="part-add">+ Visit</button></div></fieldset>`;
}
async function saveParts(form,cid){
  const box=form.querySelector('#partRows');if(!box)return;const root=box.dataset.root;
  let n=Math.max(1,...jobParts(root).map(e=>e.part||2));const newTasks=[];
  for(const id of (form.dataset.removed||'').split(',').filter(Boolean))await store.remove('schedule',id);
  for(const r of box.querySelectorAll('.part-row')){const date=r.querySelector('[name=pdate]');if(!date||date.disabled||!date.value)continue;
    const id=r.dataset.id||newId(),prev=S.schedule.find(e=>e.id===id)||{};
    const dur=(parseInt(r.querySelector('[name=ph]').value,10)||0)*60+(parseInt(r.querySelector('[name=pm]').value,10)||0)||60;
    const part=prev.part||++n;
    let task=(r.querySelector('[name=mname]').value||'').trim();if(/^main job/i.test(task))task='';
    const qty=parseFloat(r.querySelector('[name=mqty]').value)||1,price=parseFloat(r.querySelector('[name=mprice]').value)||0;
    const others=(prev.items||[]).filter(m=>m.name!==prev.task);
    const items=task&&price?[{name:task,qty,price},...others]:others;
    if(task)newTasks.push({name:task,price});
    await store.put('schedule',id,{...prev,id:undefined,customerId:cid,kind:'extra',date:date.value,start:r.querySelector('[name=pstart]').value||'',duration:dur,partOf:root,part,task,items,notes:prev.notes||''});}
  if(newTasks.length){const known=new Set(catalogue().map(x=>x.name.toLowerCase())),next=clone(S.settings);let changed=false;
    for(const t of newTasks){const k=t.name.toLowerCase();if(known.has(k))continue;known.add(k);changed=true;
      if(t.price)next.services=[...(next.services||[]),{name:t.name,price:t.price}];else next.tasks=[...(next.tasks||[]),t.name];}
    if(changed)await saveSettings(next);}
}
function updateApptSum(form){const el=$('#apptSum');if(!el)return;const it=readItems($('#apptRows')||form);el.textContent=it.length?`Line items: ${gbp(itemsTotal(it))}`:'';}

  ${o&&o.status!=='completed'?`<p class="muted" style="margin-top:8px">Mark as done logs the visit with the time and line items above. You can change the details later under Visits.</p>`:''}</form>`);

async function saveAppt(form){
  const fd=new FormData(form),key=form.dataset.key,o=key?findOcc(key):null;
  const partOf=form.dataset.partOf||'',pf=partOf?findOcc(partOf):null;
  const cid=o?o.customerId:pf?pf.customerId:fd.get('customerId'),date=fd.get('date');
  if(!cid||!date)return toast('Choose a customer and a date.');
  const items=readItems($('#apptRows')||form);
  const body={customerId:cid,date,start:fd.get('start')||'',duration:readDur(form,'duration')||60,notes:(fd.get('notes')||'').trim(),items};
  let id;
  if(o&&o.kind==='extra'){id=o.exId;body.kind='extra';}
  else if(o){id=`${cid}_${o.origDate}`;body.kind='moved';body.originalDate=o.origDate;}
  else{id=newId();body.kind='extra';if(partOf){body.partOf=partOf;body.part=Number(form.dataset.part)||2;}}
  if(o&&o.partOf){body.partOf=o.partOf;body.part=o.part||2;body.task=o.task||'';}
  S.cal.date=date;
  await saveNewItems(form,items);
  const done=form.dataset.done==='1';form.dataset.done='';
  if(done&&date>todayStr())return toast('That date is still to come. Change it to today or earlier to mark it as done.');
  if(done){const c=S.customers[cid]||{};const vid=newId();
    const visit={customerId:cid,date,start:body.start,end:body.start?addMins(body.start,body.duration):'',minutes:body.duration,tasks:o.task?[o.task]:(c.tasks||[]).slice(),materials:items,
      labourType:ltFor(c),rate:c.rate!==''&&c.rate!=null?c.rate:S.settings.hourlyRate,fixedPrice:c.price??'',notes:body.notes,invoiced:false,invoicedOn:null,
      scheduledKey:o.key,partOf:o.partOf||'',createdAt:new Date().toISOString()};
    return persist(form,async()=>{await store.put('schedule',id,body);await saveParts(form,cid);await store.put('visits',vid,visit);},`Visit logged: ${fmtMins(body.duration)}`);}
  await persist(form,async()=>{await store.put('schedule',id,body);await saveParts(form,cid);},o?(o.date!==date||o.start!==body.start?'Visit updated and moved':'Visit updated'):partOf?`Part ${body.part} added for ${shortDate(date)}`:'Visit added to the schedule');
}

function viewVisits(){
  if(!S.ready)return `<p class="muted">Loading…</p>`;
  let list=[...S.visits].sort((a,b)=>(b.date+(b.start||'')).localeCompare(a.date+(a.start||'')));
  if(S.visitFilter==='uninvoiced')list=list.filter(v=>!v.invoiced);
  let h=`<div class="bar"><h2 class="page-title">Visits</h2><button class="btn small primary" data-action="log-visit">Log visit</button></div>
  <div class="seg-btns"><button data-action="vfilter" data-f="all" aria-pressed="${S.visitFilter==='all'}">All</button><button data-action="vfilter" data-f="uninvoiced" aria-pressed="${S.visitFilter==='uninvoiced'}">Not invoiced</button></div>`;
  if(!list.length)return h+`<p class="muted" style="margin-top:20px">${S.visits.length?'Every visit has been invoiced.':'No visits logged yet. Log one from your round or with the button above.'}</p>`;
  const months={};for(const v of list)(months[v.date.slice(0,7)]=months[v.date.slice(0,7)]||[]).push(v);
  for(const[k,vs]of Object.entries(months)){
    const tot=vs.reduce((s,v)=>s+visitTotals(v).total,0);
    h+=`<div class="month"><h3>${niceDate(k+'-01',{month:'long',year:'numeric'})}</h3><span>${gbp(tot)}</span></div>`;
    h+=vs.map(v=>{const t=visitTotals(v);return `<button class="item" data-action="edit-visit" data-id="${esc(v.id)}"><span class="item-main"><strong>${esc(custName(v.customerId))}</strong><span class="item-sub">${niceDate(v.date,{weekday:'short',day:'numeric',month:'short'})}${t.mins?`, ${fmtMins(t.mins)}`:''}${v.tasks&&v.tasks.length?`, ${esc(v.tasks.join(', '))}`:''}</span></span><span class="item-end">${gbp(t.total)}${v.invoiced?'<span class="badge ok">Invoiced</span>':''}</span></button>`;}).join('');
  }
  return h;
}

function viewCustomers(){
  if(!S.ready)return `<p class="muted">Loading…</p>`;
  const n=Object.keys(S.customers).length;
  return `<div class="bar"><h2 class="page-title">Customers</h2><button class="btn small primary" data-action="new-customer">Add customer</button></div>
  ${n>5?`<input id="custSearch" type="search" placeholder="Search all customers, including paused" aria-label="Search customers">`:''}
  <div id="custList">${custListHtml('')}</div>`;
}
function custListHtml(q){
  q=q.trim().toLowerCase();
  const all=sortedCustomers().filter(c=>!q||(c.name||'').toLowerCase().includes(q)||(c.address||'').toLowerCase().includes(q));
  const nPaused=all.filter(c=>!isActive(c)).length;
  const list=q||S.showPaused?all:all.filter(isActive);
  const toggle=!q&&nPaused?`<button class="btn small" style="margin-top:14px" data-action="toggle-paused">${S.showPaused?'Hide paused customers':`Show ${nPaused} paused customer${nPaused===1?'':'s'}`}</button>`:'';
  if(!Object.keys(S.customers).length)return `<p class="muted" style="margin-top:16px">No customers yet.</p>`;
  if(!list.length)return (q?`<p class="muted" style="margin-top:16px">No customers match that search.</p>`:`<p class="muted" style="margin-top:16px">No active customers.</p>`)+toggle;

function invoiceText(c,visits,from,to){
  const L=[c.name];if(c.address)L.push(c.address.replace(/\s*\n\s*/g,', '));
  const long={day:'numeric',month:'long',year:'numeric'};
  L.push(`Garden maintenance, ${niceDate(from,long)} to ${niceDate(to,long)}`,'','Work carried out');
  let lab=0;const agg={};
  for(const v of visits){const t=visitTotals(v);lab+=t.labour;
    const extra=v.labourType==='contract'?' (included in contract)':v.labourType==='fixed'?'':t.mins?` (${fmtMins(t.mins)})`:'';
    L.push(`${niceDate(v.date,{weekday:'short',day:'numeric',month:'short'})}: ${(v.tasks||[]).join(', ')||'Garden maintenance'}${extra} – ${gbp(t.labour)}`);
    for(const m of v.materials||[]){const k=m.name+'|'+(Number(m.price)||0);agg[k]=agg[k]||{name:m.name,price:Number(m.price)||0,qty:0};agg[k].qty+=Number(m.qty)||0;}}
  const mats=Object.values(agg);let mat=0;
  if(mats.length){L.push('','Materials and goods');for(const m of mats){const a=r2(m.qty*m.price);mat+=a;L.push(`${m.qty} x ${m.name} at ${gbp(m.price)} – ${gbp(a)}`);}}
  L.push('',`Labour: ${gbp(lab)}`);if(mats.length)L.push(`Materials: ${gbp(mat)}`);L.push(`Total: ${gbp(lab+mat)}`);
  return L.join('\n');
}

function invoiceLines(visits){
  const lines=[],agg={},jobs=new Map();
  const vs=[...visits].sort((a,b)=>a.date.localeCompare(b.date));
  for(const v of vs){
    const t=visitTotals(v),jk=v.partOf||v.scheduledKey||'';
    for(const m of v.materials||[]){const k=m.name+'|'+(Number(m.price)||0);agg[k]=agg[k]||{name:m.name,price:Number(m.price)||0,qty:0};agg[k].qty+=Number(m.qty)||0;}
    if(v.labourType==='contract')continue;
    if(v.labourType==='hourly'&&t.mins&&jk&&vs.some(x=>x!==v&&(x.partOf===jk||(x.scheduledKey===jk&&v.partOf)))){
      const gk=jk+'|'+(Number(v.rate)||0);let j=jobs.get(gk);
      if(!j){j={dates:[],tasks:[],mins:0,rate:Number(v.rate)||0,line:{hours:true}};jobs.set(gk,j);lines.push(j.line);}
      j.dates.push(v.date);j.tasks.push(...(v.tasks||[]));j.mins+=t.mins;continue;}
    const what=`${shortDate(v.date)}${v.partOf?` (finishing ${shortDate(jobDate(v.partOf))} job)`:''}: ${(v.tasks||[]).join(', ')||'Garden maintenance'}`;
    if(v.labourType==='fixed')lines.push({desc:what,qty:1,unit:t.labour,amount:t.labour});
    else if(t.mins)lines.push({desc:what,qty:r2(t.mins/60),unit:Number(v.rate)||0,amount:t.labour,hours:true});
  }
  for(const j of jobs.values()){const d=[...new Set(j.dates)].sort();
    Object.assign(j.line,{desc:`${shortDate(d[0])}${d.length>1?`, finished ${d.slice(1).map(shortDate).join(' and ')}`:''}: ${uniq(j.tasks).join(', ')||'Garden maintenance'}`,qty:r2(j.mins/60),unit:j.rate,amount:r2(j.mins/60*j.rate)});}
  for(const m of Object.values(agg))lines.push({desc:m.name,qty:m.qty,unit:m.price,amount:r2(m.qty*m.price)});
  return lines;
}

function paymentsOf(inv){if(inv.payments&&inv.payments.length)return [...inv.payments].sort((a,b)=>a.date.localeCompare(b.date));
  return inv.status==='paid'?[{amount:inv.total,date:inv.paidOn||inv.issueDate,method:'',ref:''}]:[];}
function paidAmount(inv){return r2(paymentsOf(inv).reduce((s,p)=>s+(Number(p.amount)||0),0));}
function balanceDue(inv){return Math.max(0,r2(inv.total-paidAmount(inv)));}
function accountBalance(inv){if(inv.practice)return balanceDue(inv);const same=i=>!i.practice&&(inv.customerId?i.customerId===inv.customerId:i.customerName===inv.customerName);
  const list=S.invoices.filter(same);if(!list.some(i=>i.id===inv.id))list.push(inv);return r2(list.reduce((s,i)=>s+balanceDue(i),0));}
function lastPayDate(inv){const p=paymentsOf(inv);return p.length?p[p.length-1].date:'';}
function invStatus(inv){if(balanceDue(inv)<=0)return 'paid';if(paidAmount(inv)>0)return inv.dueDate<todayStr()?'overdue':'part';return inv.dueDate<todayStr()?'overdue':'unpaid';}
const STATUS_LABEL={paid:'Paid',overdue:'Overdue',unpaid:'Unpaid',part:'Part paid'};
const PAY_METHODS=['Bank transfer','Cash','Card','Cheque','Other'];

    return `mailto:${encodeURIComponent(inv.customerEmail||'')}?subject=${encodeURIComponent(`TEST: receipt ${inv.number} from ${biz} (no payment made)`)}&body=${encodeURIComponent(body)}`;}

function monthInfo(month){
  const start=month+'-01',end=addDays(addMonths(start,1),-1);
  const [y,m]=month.split('-').map(Number);
  return{month,start,end,label:new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'})};

function extrasLines(){return (S.inv.extras||[]).filter(x=>x.name&&x.qty>0).map(x=>({desc:x.name,qty:x.qty,unit:x.price,amount:r2(x.qty*x.price)}));}
function draftInvoice(){
  const I=S.inv,c=S.customers[I.customerId];if(!c)return null;
  if(c.pricing==='monthly'){

    const visits=S.visits.filter(v=>v.customerId===c.id&&!v.invoiced&&v.date>=mi.start&&v.date<=mi.end);
    const amt=r2(Number(c.monthly)||0);
    const lines=[{desc:`${c.contractDesc||'Grounds maintenance'}, ${mi.label}`,qty:1,unit:amt,amount:amt},...invoiceLines(visits),...extrasLines()];

  }
  const visits=chosenVisits(),lines=[...invoiceLines(visits),...extrasLines()];
  return{c,visits,lines,contract:false,total:r2(lines.reduce((s,l)=>s+l.amount,0))};
}

  const v=readVisit(form);
  if(!v.customerId||!v.date)return toast('Choose a customer and a date.');
  const id=form.dataset.id||newId(),prev=S.visits.find(x=>x.id===id);
  v.invoicedOn=v.invoiced?(prev&&prev.invoicedOn||todayStr()):null;
  v.createdAt=prev&&prev.createdAt||new Date().toISOString();
  const fromTimer=form.dataset.timer==='1';
  await saveNewItems(form,v.materials);
  await persist(form,async()=>{await store.put('visits',id,v);if(fromTimer)await saveSettings({...clone(S.settings),timer:null});},'Visit saved');
}
async function persist(form,fn,msg){
  const btn=form.querySelector('[type=submit]');if(btn)btn.disabled=true;
  try{await fn();closeSheet();toast(msg);}
  catch(e){if(btn)btn.disabled=false;toast(e&&e.code==='quota_exceeded'?'Storage is full. Export your visits and delete old ones to make room.':'That didn’t save. Check your signal and try again.');}
}
async function setLogo(file){
  if(file.size>8e6)return toast('That picture is too big. Use one under 8 MB.');
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url;});
    const fit=(max)=>{const s=Math.min(1,max/Math.max(im.width,im.height));return[Math.max(1,Math.round(im.width*s)),Math.max(1,Math.round(im.height*s))];};
    let [w,h]=fit(400);let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);
    const png=cv.toDataURL('image/png');
    [w,h]=fit(720);cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);
    const jpg=cv.toDataURL('image/jpeg',0.88).split(',')[1];
    await saveSettings({...clone(S.settings),logo:{png,jpg:{w,h,b64:jpg}}});toast('Logo saved');
  }catch(e){toast('That picture couldn’t be read. Try a PNG or JPG.');}
  finally{URL.revokeObjectURL(url);}
}
async function saveSettings(obj){S.settings=obj;render();await store.putSettings(obj);}

function armed(btn,label){if(btn.dataset.armed)return true;const old=btn.textContent;btn.dataset.armed='1';btn.textContent=label;
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old;}},3500);return false;}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);toast('Summary copied');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  toast(ok?'Summary copied':'Press and hold the summary to select and copy it.');
}
async function exportCsv(){
  const rows=[['Date','Customer','Address','Start','Finish','Minutes','Work done','Materials','Labour (£)','Materials (£)','Total (£)','Invoiced','Notes']];
  for(const v of [...S.visits].sort((a,b)=>a.date.localeCompare(b.date))){const t=visitTotals(v),c=S.customers[v.customerId]||{};
    rows.push([v.date,custName(v.customerId),(c.address||'').replace(/\n/g,', '),v.start,v.end,t.mins,(v.tasks||[]).join('; '),(v.materials||[]).map(m=>`${m.qty} x ${m.name} @ ${m.price}`).join('; '),t.labour.toFixed(2),t.materials.toFixed(2),t.total.toFixed(2),v.invoiced?(v.invoicedOn||'Yes'):'No',v.notes||'']);}
  const csv=rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  if(S.downloads){try{await S.downloads.save({filename:`garden-visits-${todayStr()}.csv`,data:csv});}catch(e){toast('The export didn’t complete.');}}
  else await copyText(csv);
}

document.addEventListener('click',async e=>{

      break;
    case 'stop-timer':{const t=S.settings.timer;if(!t)break;const d=new Date(t.start);

      closeSheet();openVisitForm({customerId:t.customerId,date:localDate(d),start:localTime(d),end:localTime(new Date()),fromTimer:true,scheduledKey:t.scheduledKey||'',materials:so&&so.items||[],partOf:so&&so.partOf||''});break;}
    case 'discard-timer':
      if(armed(a,'Discard?'))try{await saveSettings({...clone(S.settings),timer:null});}catch(err){toast('That didn’t save. Try again.');}
      break;

      try{await store.put('invoices',id,{...rest,payments,status:'unpaid',paidOn:null});toast('Last payment removed');openInvoiceSheet(id,{...rest,payments,status:'unpaid',paidOn:null,id});}catch(e){toast('That didn’t save. Try again.');}break;}
    case 'inv-delete':{const inv=S.invoices.find(x=>x.id===id);if(!inv||!armed(a,'Tap again to delete'))break;
      try{for(const v of S.visits.filter(v=>v.invoiceId===id)){const{id:vid,...rest}=clone(v);delete rest.invoiceId;await store.put('visits',vid,{...rest,invoiced:false,invoicedOn:null});}
        await store.remove('invoices',id);closeSheet();toast(`Invoice ${inv.number} deleted`);}catch(e){toast('That didn’t delete. Try again.');}break;}

      S.cal.date=a.dataset.d;S.cal.view='day';render(true);window.scrollTo(0,0);break;}

      const last=[...box.querySelectorAll('[name=pdate]')].map(x=>x.value).filter(Boolean).sort().pop()||f.elements.date.value||todayStr();

    case 'add-part':{const o=findOcc(a.dataset.key);if(!o)break;openApptForm({partOf:o.partOf||o.key});break;}

      openVisitForm({customerId:o.customerId,date:o.date>todayStr()?todayStr():o.date,start:o.start,end:o.start?addMins(o.start,o.duration):'',scheduledKey:o.key,materials:o.items,partOf:o.partOf||''});break;}

document.addEventListener('submit',async e=>{
  const f=e.target;if(f.id==='loginForm')return;e.preventDefault();
  if(f.id==='visitForm')saveVisit(f);
  else if(f.id==='custForm')saveCustomer(f);
  else if(f.id==='apptForm')saveAppt(f);
  else if(f.id==='payForm')savePayment(f);
  else if(f.id==='settingsForm'){
    const fd=new FormData(f);
    const tasks=uniq(String(fd.get('tasks')||'').split('\n').map(s=>s.trim()));
    const priced=k=>String(fd.get(k)||'').split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{const i=line.lastIndexOf(',');
      if(i<0)return{name:line,price:0};const p=parseFloat(line.slice(i+1).replace(/[£\s]/g,''));return isNaN(p)?{name:line,price:0}:{name:line.slice(0,i).trim(),price:p};});
    const materials=priced('materials'),services=priced('services');
    const g=k=>String(fd.get(k)||'').trim();
    const next={...clone(S.settings),businessName:g('businessName'),hourlyRate:parseFloat(fd.get('hourlyRate'))||0,tasks,materials,services,
      address:g('address'),phone:g('phone'),email:g('email'),bankName:g('bankName'),sortCode:g('sortCode'),accountNumber:g('accountNumber'),

    const btn=f.querySelector('[type=submit]');btn.disabled=true;

  }
});

const SB=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
S.downloads={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}};
function showLogin(msg){
  document.body.classList.add('signed-out');$('#timerSlot').innerHTML='';
  $('#view').innerHTML=`<form class="login" id="loginForm"><h2>Sign in</h2><p>Enter your email and we’ll send you a sign-in link. Open it on this phone or computer.</p>
  <label class="f">Email<input name="email" type="email" required autocomplete="email" inputmode="email"></label>
  <div class="actions"><button class="btn primary" type="submit">Email me a sign-in link</button></div>${msg?`<p style="margin-top:14px">${esc(msg)}</p>`:''}</form>`;
  $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();e.stopPropagation();const f=e.target,btn=f.querySelector('button');btn.disabled=true;
    const email=String(new FormData(f).get('email')).trim();
    const{error}=await SB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});
    if(error){btn.disabled=false;toast(error.message);return;}
    f.innerHTML=`<h2>Check your email</h2><p>We’ve sent a sign-in link to <strong>${esc(email)}</strong>. Tap it and the app will open signed in. It can take a minute to arrive, so check your spam folder too.</p><div class="actions"><button class="btn" type="button" onclick="location.reload()">Use a different email</button></div>`;
  },true);
}
async function claimImport(uid){
  const{data,error}=await SB.from('import_inbox').select('tbl,id,data');if(error||!data||!data.length)return 0;
  for(const r of data){
    const q=r.tbl==='settings'?SB.from('settings').upsert({owner_id:uid,data:r.data},{onConflict:'owner_id'})
      :SB.from(r.tbl).upsert({owner_id:uid,id:r.id,data:r.data},{onConflict:'owner_id,id',ignoreDuplicates:true});
    const{error:e}=await q;if(e)throw e;
  }
  await SB.from('import_inbox').delete().neq('id','');
  return data.length;
}
let started=false;
async function startApp(session){
  if(started)return;started=true;
  document.body.classList.remove('signed-out');
  const uid=session.user.id;S.userEmail=session.user.email;
  try{const n=await claimImport(uid);if(n)toast('Your customers and settings have been moved across');}catch(e){toast('Couldn’t move your old records across yet. Reload to try again.');}
  store=makeSupabaseStore(SB,uid);
  const got={c:false,v:false};
  const maybeReady=()=>{if(got.c&&got.v&&!S.ready){S.ready=true;}render();};
  render(true);
  store.watch({
    customers:list=>{const m={};for(const c of list)m[c.id]=c;S.customers=m;got.c=true;maybeReady();},
    visits:list=>{S.visits=list;got.v=true;maybeReady();},
    schedule:list=>{S.schedule=list;render();},
    invoices:list=>{S.invoices=list;render();},
    settings:s=>{S.settings={...defaultSettings(),...(s?clone(s):{})};render();
      if(s&&!s.logo&&s.logo!==null&&s.businessName==='The Lakes Gardener'&&!window.__logoMove){window.__logoMove=1;const sc=document.createElement('script');sc.src='lakes-logo.js';
        sc.onload=()=>{if(window.LAKES_LOGO&&!S.settings.logo)saveSettings({...clone(S.settings),logo:window.LAKES_LOGO}).catch(()=>{});};document.head.appendChild(sc);}}},
    e=>{if(e&&/not allowed|permission|JWT|row-level/i.test(e.message||''))toast('This email isn’t set up to use the app.');});
}
(async()=>{
  const{data:{session}}=await SB.auth.getSession();
  if(session)startApp(session);else{
    const err=new URLSearchParams(location.hash.slice(1)).get('error_description');
    showLogin(err?`That link didn’t work (${err}). Ask for a new one.`:'');}
  SB.auth.onAuthStateChange((ev,s)=>{if(s&&!started)startApp(s);if(ev==='SIGNED_OUT')location.reload();});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
